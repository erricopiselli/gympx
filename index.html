<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GymPX — Diario di Allenamento</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymPX">
<meta name="theme-color" content="#131314">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131314;
  --surface:#1E1F20;
  --surface2:#28292B;
  --border:#3C3F41;
  --text:#E3E3E3;
  --muted:#9AA0A6;
  --accent:#8BD17C;
  --accent-ink:#8BD17C;
  --on-accent:#0B3D0F;
  --warn:#FF6B4A;
  --radius:20px;
  --cat-corpo_libero:#8AB4F8;
  --cat-macchina:#FDBA74;
  --cat-manubri_piedi:#8BD17C;
  --cat-manubri_panca:#F792C6;
  --cat-elastico:#4FD3C4;
}
html[data-theme="light"]{
  --bg:#FFFFFF;
  --surface:#F1F3F4;
  --surface2:#E8EAED;
  --border:#DADCE0;
  --text:#202124;
  --muted:#5F6368;
  --accent:#34A853;
  --accent-ink:#1E8E3E;
  --on-accent:#FFFFFF;
}
html[data-theme="light"] .exercise-card{box-shadow:0 1px 2px rgba(60,64,67,0.15), 0 1px 3px rgba(60,64,67,0.08);}
html[data-theme="light"] .bottom-nav{box-shadow:0 -1px 3px rgba(60,64,67,0.1);}
html[data-theme="light"] .modal{box-shadow:0 -2px 12px rgba(60,64,67,0.15);}
html[data-theme="light"] .timer-banner{box-shadow:0 -2px 10px rgba(60,64,67,0.12);}
html[data-theme="light"] .fab{box-shadow:0 2px 6px rgba(60,64,67,0.3), 0 4px 10px rgba(60,64,67,0.15);}
html[data-theme="light"] .day-tab.active{box-shadow:none;}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Roboto',sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:96px;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;}

header.topbar{
  position:sticky;top:0;z-index:10;
  background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 22px) 16px 6px;
}
.brand{display:flex;align-items:center;justify-content:space-between;}
.brand h1{
  font-family:'Roboto',sans-serif;
  font-weight:900;
  font-size:27px;
  letter-spacing:-0.5px;
  margin:0;
}
.brand h1 span{color:var(--accent-ink);}
.settings-btn{
  background:none;border:none;color:var(--muted);
  width:40px;height:40px;border-radius:50%;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.15s;
}
.settings-btn:active{background:var(--surface2);}

.day-tabs{
  display:flex;gap:8px;overflow-x:auto;padding:14px 0 8px;
  scrollbar-width:none;
}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{
  flex:0 0 auto;
  font-family:'Roboto',sans-serif;
  font-size:13.5px;font-weight:500;
  padding:9px 16px;border-radius:999px;
  background:var(--surface);color:var(--muted);
  border:1px solid var(--border);
  cursor:pointer;
  transition:background 0.15s;
}
.day-tab.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700;}
.day-tab.today:not(.active)::after{content:' •';color:var(--accent-ink);}
.day-count{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:16px;height:16px;font-size:9.5px;background:var(--accent);color:var(--on-accent);
  border-radius:50%;margin-left:6px;padding:0 3px;font-weight:700;font-family:'Roboto Mono',monospace;
  vertical-align:middle;
}
.day-tab.active .day-count{background:rgba(0,0,0,0.18);color:var(--on-accent);}

.save-btn,.timer-launch-btn,.day-tool-btn,.add-btn,.icon-btn,.settings-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.chip{display:inline-flex;align-items:center;gap:4px;}
.reorder-btns button{display:flex;align-items:center;justify-content:center;}

main{padding:8px 16px 24px;}
.day-heading-row{display:flex;align-items:center;justify-content:space-between;margin:12px 4px 16px;}
.day-heading{
  font-family:'Roboto',sans-serif;font-size:22px;color:var(--text);font-weight:700;
}
.day-tool-btn{
  background:var(--surface);border:1px solid var(--border);color:var(--muted);
  font-size:11.5px;padding:7px 12px;border-radius:999px;cursor:pointer;
  font-family:'Roboto',sans-serif;
}

.empty-state{
  text-align:center;padding:40px 20px;color:var(--muted);
  background:var(--surface);border:none;border-radius:var(--radius);margin-bottom:12px;
}
.empty-state svg{opacity:0.4;}
.empty-state p{margin:10px 0 0;font-size:14px;line-height:1.5;}

.lib-search{
  width:100%;background:var(--surface2);border:none;color:var(--text);
  padding:13px 16px;border-radius:999px;font-family:'Roboto',sans-serif;font-size:14px;
  margin-bottom:12px;-webkit-appearance:none;
  box-shadow:0 1px 2px rgba(0,0,0,0.15) inset;
}
.lib-search:focus{outline:2px solid var(--accent);outline-offset:1px;}

.exercise-card{
  background:var(--surface);border:none;
  border-radius:var(--radius);padding:18px;margin-bottom:14px;
  animation:fadein .3s ease;
  box-shadow:0 1px 2px rgba(0,0,0,0.4), 0 1px 4px rgba(0,0,0,0.25);
  touch-action:pan-y;
  position:relative;
}
.exercise-card.swipe-left{background:rgba(255,107,74,0.20) !important;}
.exercise-card.swipe-right{background:rgba(139,209,124,0.20) !important;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.exercise-card{animation:none;}}

.ex-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}
.ex-icon{
  flex:0 0 auto;width:40px;height:40px;border-radius:12px;
  background:var(--surface2);display:flex;align-items:center;justify-content:center;
  color:var(--accent-ink);
}
.ex-icon.cat-corpo_libero{background:rgba(138,180,248,0.16);color:var(--cat-corpo_libero);}
.ex-icon.cat-macchina{background:rgba(253,186,116,0.16);color:var(--cat-macchina);}
.ex-icon.cat-manubri_piedi{background:rgba(139,209,124,0.16);color:var(--cat-manubri_piedi);}
.ex-icon.cat-manubri_panca{background:rgba(247,146,198,0.16);color:var(--cat-manubri_panca);}
.ex-icon.cat-elastico{background:rgba(79,211,196,0.16);color:var(--cat-elastico);}
.ex-title{flex:1;min-width:0;padding-top:2px;}
.ex-title h3{font-family:'Roboto',sans-serif;font-size:16.5px;margin:0 0 2px;font-weight:700;}
.ex-title .type-label{font-size:12px;color:var(--muted);}
.reorder-btns{display:flex;flex-direction:column;gap:2px;}
.reorder-btns button{
  background:var(--surface2);border:none;color:var(--muted);
  width:26px;height:22px;font-size:10px;border-radius:7px;cursor:pointer;padding:0;
}
.icon-btn{background:var(--surface2);border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:7px 10px;border-radius:999px;white-space:nowrap;}
.icon-btn:active{transform:scale(0.94);}

.note-box{background:rgba(139,209,124,0.10);border:none;border-radius:14px;padding:11px 14px;margin-bottom:12px;}
.note-label{font-size:11px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;font-weight:700;}
.note-box p{font-size:13.5px;line-height:1.5;color:var(--text);margin:0;white-space:pre-wrap;}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.chip{
  font-family:'Roboto Mono',monospace;font-size:12px;font-weight:500;
  padding:6px 12px;border-radius:999px;
  background:var(--surface2);
  border:none;color:var(--text);
}
.chip.kg{color:var(--warn);background:rgba(255,107,74,0.14);}

.nudge{
  display:flex;gap:8px;align-items:flex-start;
  background:rgba(255,107,74,0.12);border:none;
  color:var(--warn);border-radius:14px;padding:11px 14px;font-size:13px;
  margin-bottom:12px;line-height:1.45;
}
.progress-note{font-size:12.5px;color:var(--accent-ink);margin-bottom:12px;font-weight:500;}

.log-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.log-row{display:flex;align-items:center;gap:6px;}
.log-row .set-label{width:52px;flex:0 0 auto;font-size:12px;color:var(--muted);font-family:'Roboto Mono',monospace;}
.log-row input{
  flex:1;background:var(--surface2);border:none;
  color:var(--text);border-radius:10px;padding:10px;font-family:'Roboto Mono',monospace;
  font-size:14px;width:100%;min-width:0;
}
.log-row input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.work-timer-btn{
  flex:0 0 auto;background:var(--surface2);border:none;color:var(--accent-ink);
  border-radius:10px;padding:0 10px;font-size:12px;font-family:'Roboto Mono',monospace;cursor:pointer;height:40px;
}
.log-row .set-done-btn{
  flex:0 0 auto;width:40px;height:40px;background:var(--surface2);color:var(--accent-ink);
  border:none;border-radius:10px;font-size:16px;cursor:pointer;
}
.log-row .set-done-btn:active{background:var(--accent);color:var(--on-accent);}
.log-row.flash{animation:rowFlash 0.65s ease;border-radius:10px;}
@keyframes rowFlash{0%{background:transparent;}30%{background:rgba(139,209,124,0.18);}100%{background:transparent;}}
@media (prefers-reduced-motion:reduce){.log-row.flash{animation:none;}}

.log-actions-row{display:flex;gap:8px;}
.save-btn{
  flex:1;background:var(--accent);color:var(--on-accent);border:none;
  padding:13px;border-radius:999px;font-weight:700;font-size:14px;
  cursor:pointer;font-family:'Roboto',sans-serif;
}
.save-btn:active{transform:scale(0.98);}
.timer-launch-btn{
  flex:0 0 auto;background:var(--surface2);border:none;color:var(--accent-ink);
  border-radius:999px;padding:0 16px;font-size:15px;cursor:pointer;
}

.history{margin-top:12px;border-top:1px solid var(--border);padding-top:10px;}
.history-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-bottom:6px;}
.history-list{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;margin-bottom:6px;}
.progress-chart{color:var(--accent-ink);display:block;width:100%;}
.progress-chart .chart-label{font-size:9px;fill:var(--muted);font-family:'Roboto Mono',monospace;}

.add-btn{
  width:100%;background:var(--surface);border:none;color:var(--muted);
  padding:15px;border-radius:var(--radius);font-size:14px;cursor:pointer;margin-top:2px;
  font-family:'Roboto',sans-serif;font-weight:500;
}
.add-btn:active{background:var(--surface2);color:var(--accent-ink);}

.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;
  justify-content:center;z-index:100;
}
.modal{
  background:var(--surface);border-top-left-radius:28px;border-top-right-radius:28px;
  width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:12px 20px 28px;
  animation:slideup .25s ease;
  box-shadow:0 -2px 16px rgba(0,0,0,0.4);
}
.modal::before{content:'';display:block;width:32px;height:4px;background:var(--border);border-radius:999px;margin:0 auto 18px;}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:none;opacity:1;}}
.modal h2{font-family:'Roboto',sans-serif;font-size:19px;margin:0 0 16px;font-weight:700;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%;background:var(--surface2);border:none;color:var(--text);
  padding:11px;border-radius:12px;font-family:'Roboto',sans-serif;font-size:14px;
}
.field textarea{min-height:70px;resize:vertical;font-family:'Roboto',sans-serif;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;min-width:0;}
.modal-actions{display:flex;gap:10px;margin-top:8px;}
.modal-actions button{flex:1;padding:13px;border-radius:999px;font-weight:700;font-size:14px;border:none;cursor:pointer;}
.btn-primary{background:var(--accent);color:var(--on-accent);}
.btn-secondary{background:var(--surface2);color:var(--text);}
.btn-danger{background:rgba(255,107,74,0.14);color:var(--warn);}

.mode-toggle{display:flex;gap:8px;}
.mode-btn{
  flex:1;background:var(--surface2);border:none;color:var(--muted);
  padding:11px;border-radius:12px;font-size:13px;cursor:pointer;font-family:'Roboto',sans-serif;font-weight:500;
}
.mode-btn.active{background:var(--accent);color:var(--on-accent);font-weight:700;}

.settings-list button{
  width:100%;text-align:left;background:var(--surface2);border:none;
  color:var(--text);padding:13px 14px;border-radius:14px;margin-bottom:10px;font-size:14px;cursor:pointer;
  font-family:'Roboto',sans-serif;
}
.settings-list button.danger{color:var(--warn);}
.settings-section-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin:14px 0 8px;font-weight:700;}

.gh-home-status{
  display:flex;align-items:center;gap:9px;
  background:var(--surface2);border-radius:12px;
  padding:9px 13px;margin-top:12px;
  font-size:12px;color:var(--text);cursor:pointer;
}
.gh-home-status-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gh-home-chevron{color:var(--muted);font-size:15px;flex:0 0 auto;}
.gh-status-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.gh-status-dot.on{background:#3DDC84;box-shadow:0 0 0 3px rgba(61,220,132,0.18);}
.gh-status-dot.off{background:var(--muted);}
.gh-status-dot.syncing{background:#F2B800;animation:ghPulse 1s ease-in-out infinite;}
.gh-status-dot.error{background:var(--warn);}
@keyframes ghPulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
@media (prefers-reduced-motion:reduce){.gh-status-dot.syncing{animation:none;}}

.day-pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.day-pick-grid button{
  background:var(--surface2);border:none;color:var(--text);
  padding:11px 4px;border-radius:12px;font-size:13px;cursor:pointer;font-family:'Roboto',sans-serif;font-weight:500;
}
.day-pick-grid button:active{background:var(--accent);color:var(--on-accent);}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
.stat-card{background:var(--surface2);border-radius:16px;padding:14px 10px;text-align:center;}
.stat-value{font-size:26px;font-weight:900;font-family:'Roboto',sans-serif;line-height:1.1;}
.stat-label{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3;}

.progress-list{display:flex;flex-direction:column;gap:12px;max-height:52vh;overflow-y:auto;margin-bottom:14px;padding-right:2px;}
.progress-item{background:var(--surface2);border-radius:16px;padding:14px;}
.progress-item-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.progress-item-name{font-weight:700;font-size:14.5px;}
.progress-item-meta{font-size:11.5px;color:var(--muted);margin-top:1px;}
.progress-badge{font-size:10.5px;padding:5px 10px;border-radius:999px;font-weight:700;white-space:nowrap;flex:0 0 auto;}
.progress-badge.good{background:rgba(139,209,124,0.2);color:var(--accent-ink);}
.progress-badge.warn{background:rgba(255,107,74,0.18);color:var(--warn);}
.progress-badge.neutral{background:var(--surface);color:var(--muted);}
.progress-section-label{font-size:12.5px;font-weight:700;color:var(--text);margin:4px 0 10px;}
.activity-chart-box{background:var(--surface2);border-radius:16px;padding:14px 10px 8px;margin-bottom:18px;}

.pr-badge{display:inline-block;font-size:14px;vertical-align:middle;}
.exercise-card.pr-pulse{animation:prPulse 0.9s ease;}
@keyframes prPulse{0%{box-shadow:0 0 0 0 rgba(139,209,124,0.55);}100%{box-shadow:0 0 0 16px rgba(139,209,124,0);}}
@media (prefers-reduced-motion:reduce){.exercise-card.pr-pulse{animation:none;}}

.log-row.warmup-row .set-label{color:var(--warn);}
.log-row.warmup-row input{opacity:0.85;}
.warmup-btn{color:var(--warn) !important;}

.superset-wrap{
  border-left:3px solid var(--accent-ink);border-radius:16px;
  padding:2px 0 2px 12px;margin-bottom:14px;
}
.superset-wrap .exercise-card{margin-bottom:10px;}
.superset-wrap .exercise-card:last-child{margin-bottom:2px;}
.superset-label{font-size:11.5px;font-weight:700;color:var(--accent-ink);margin:6px 0 8px 2px;text-transform:uppercase;letter-spacing:0.4px;}

.toast{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%);
  background:var(--surface2);color:var(--text);padding:12px 20px;border-radius:12px;
  font-weight:500;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;
  white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.3);
}
.toast.show{opacity:1;}

.bottom-nav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;
  width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--border);
  display:flex;z-index:80;padding:8px 4px calc(4px + env(safe-area-inset-bottom));
}
.bottom-nav button{
  flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--muted);font-size:11px;font-family:'Roboto',sans-serif;font-weight:500;padding:2px 0 4px;cursor:pointer;
}
.bottom-nav .nav-icon-wrap{
  display:flex;align-items:center;justify-content:center;
  padding:5px 22px;border-radius:999px;transition:background 0.2s;
}
.bottom-nav button.active{color:var(--text);font-weight:700;}
.bottom-nav button.active .nav-icon-wrap{background:rgba(139,209,124,0.22);color:var(--accent-ink);}
.bottom-nav button:active{opacity:0.7;}

.fab-container{
  position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  bottom:calc(64px + env(safe-area-inset-bottom) + 16px);display:flex;justify-content:flex-end;padding:0 20px;pointer-events:none;z-index:70;
}
.fab{
  pointer-events:auto;width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:var(--on-accent);border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.25);
  transition:transform 0.15s ease;
}
.fab:active{transform:scale(0.92);}
body.timer-active .fab-container{display:none;}

.timer-banner{
  position:fixed;left:50%;transform:translateX(-50%);bottom:64px;
  width:100%;max-width:480px;background:var(--surface2);border-top:2px solid var(--accent);
  padding:12px 20px 20px;z-index:90;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 -6px 24px rgba(0,0,0,0.25);
}
.timer-banner.hidden{display:none;}
.timer-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
.timer-time{font-family:'Roboto Mono',monospace;font-size:36px;font-weight:700;color:var(--accent-ink);}
.timer-time.warn{color:var(--warn);}
.timer-controls{display:flex;gap:10px;margin-top:2px;}
.timer-controls button{
  background:var(--surface);border:none;color:var(--text);
  padding:9px 16px;border-radius:999px;font-size:13px;cursor:pointer;
}
body.timer-active{padding-bottom:190px;}

::selection{background:var(--accent);color:var(--on-accent);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ================= v3 ================= */
:root{ --star:#F2B800; --work:#8AB4F8; }
html[data-theme="light"]{ --star:#E8A600; --work:#1A73E8; }
.modal{overscroll-behavior:contain;}
.modal-sub{font-size:13px;color:var(--muted);margin:-8px 0 14px;line-height:1.45;}
.settings-help{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 12px;}

/* righe serie */
.log-grid .log-row, .log-head{display:grid;grid-template-columns:var(--cols);gap:6px;align-items:center;}
.log-head{margin-bottom:-2px;}
.log-head span{font-size:11px;color:var(--muted);text-align:center;}

.lib-list{max-height:46vh;overflow-y:auto;margin-bottom:14px;}

}

.seg{display:flex;gap:6px;}
.seg button{
  flex:1;background:var(--surface2);border:none;color:var(--text);border-radius:12px;padding:12px 6px;
  font-size:13px;font-family:'Roboto',sans-serif;cursor:pointer;
}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:700;}

/* progressi */
.progress-item-head{width:100%;background:none;border:none;color:var(--text);padding:0;margin:0;cursor:pointer;font-family:'Roboto',sans-serif;}
.progress-item .progress-item-head{margin-bottom:0;}
.prog-detail{margin-top:12px;border-top:1px solid var(--border);padding-top:12px;}
.chart-caption{font-size:11px;color:var(--muted);text-align:right;margin:2px 0 10px;}
.sess-list{display:flex;flex-direction:column;margin-bottom:8px;}
.sess{display:grid;grid-template-columns:62px 1fr auto;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--border);align-items:baseline;}

body.ov-open{overflow:hidden;}
body.ov-mini{padding-bottom:170px;}

  position:fixed;inset:0;z-index:300;background:var(--bg);color:var(--text);

/* ---------- theme ---------- */
function getTheme(){
  try{ return localStorage.getItem('caricoTheme')||'dark'; }catch(e){ return 'dark'; }
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
}
function toggleTheme(){
  const next = getTheme()==='light' ? 'dark' : 'light';
  try{ localStorage.setItem('caricoTheme', next); }catch(e){}
  applyTheme(next);
  renderApp();
}

/* ---------- utils extra ---------- */
function exKeyFor(name){ return String(name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''); }
function fmtKg(n){ if(n==null || n==='') return ''; const v=Math.round(Number(n)*100)/100; return String(v).replace('.',','); }
function num(v){ if(v==null || v==='') return 0; const x=parseFloat(String(v).replace(',','.')); return isNaN(x)? 0 : x; }
function numOrNull(v){ if(v==null || String(v).trim()==='') return null; const x=parseFloat(String(v).replace(',','.')); return isNaN(x)? null : x; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function roundStep(x, step){ const s=step>0? step : 1; return Math.max(0, Math.round(x/s)*s); }
function $(id){ return document.getElementById(id); }
function starsText(n){ return n? '★'.repeat(n)+'☆'.repeat(5-n) : ''; }

/* ---------- spec (definizione di un esercizio) ---------- */
function makeSpec(p){
  const type = p.type || 'corpo_libero';
  const mode = p.mode || 'reps';
  const rMin = p.repsMin!=null? +p.repsMin : 10;
  return {
    exKey: exKeyFor(p.name), name: (p.name||'').trim(), type, mode,
    repsMin: mode==='time'? null : rMin,
    repsMax: mode==='time'? null : (p.repsMax!=null? Math.max(+p.repsMax, rMin) : rMin),
    durationSec: mode==='time'? (+p.durationSec || 30) : null,
    weight: (p.weight!=null && p.weight!=='')? +p.weight : null,
    perSide: !!p.perSide,
    loaded: p.loaded!=null? !!p.loaded : defaultLoaded(type),
    weightStep: p.weightStep!=null? +p.weightStep : (DEFAULT_STEP[type] ?? 0),
    note: p.note || ''
  };
}
function isLoaded(spec){ return spec.loaded!=null? !!spec.loaded : defaultLoaded(spec.type); }
function activeSpec(st){ return st.options[Math.min(st.active||0, st.options.length-1)]; }
function nFor(item){ return item.kind==='circuit'? Math.max(1, item.rounds||1) : Math.max(1, item.sets||1); }
function repsLabel(spec){
  if(spec.mode==='time') return `${spec.durationSec}s`;
  return (spec.repsMax && spec.repsMax!==spec.repsMin)? `${spec.repsMin}-${spec.repsMax}` : `${spec.repsMin}`;
}
function specShort(spec, reps, weight){
  const w = weight!=null? weight : spec.weight;
  const base = spec.mode==='time'? `${reps!=null? reps : spec.durationSec}s`
    : `${reps!=null? reps : repsLabel(spec)} rip${spec.perSide?' per lato':''}`;
  return base + (isLoaded(spec) && w? ` × ${fmtKg(w)} kg` : '');
}
function schemeLabel(n, spec){
  if(spec.mode==='time') return `${n}× ${spec.durationSec}s`;
  return `${n}×${spec.perSide?'2×':''}${repsLabel(spec)}`;
}

/* ---------- modelli circuito precaricati ---------- */
function seedTemplates(){
  const t={};
  const mk=(name, rounds, restSec, warmup, stations, note)=>{
    const id=uid('tpl');
    t[id]={id, name, rounds, restSec, warmup, note:note||'',
      stations: stations.map(opts=>({sid:uid('st'), active:0, options:opts.map(makeSpec)}))};
  };
  mk('Riscaldamento core', 3, 60, true, [
    [{name:'Dead bug con manubri', type:'corpo_libero', mode:'reps', repsMin:15, repsMax:15, weight:8, loaded:true, weightStep:2, note:'Kg per manubrio.'}],
    [{name:'Plank', type:'corpo_libero', mode:'time', durationSec:60}],
    [{name:'Pallof press', type:'elastico', mode:'reps', repsMin:18, repsMax:18, perSide:true},
     {name:'Squat su bosu ball', type:'corpo_libero', mode:'reps', repsMin:18, repsMax:18}]
  ], 'Dopo 10 minuti di tapis roulant.');
  mk('Bicipiti + tricipiti (manubri)', 3, 60, false, [
    [{name:'Curl hammer', type:'manubri_piedi', mode:'reps', repsMin:12, repsMax:14, weight:10, note:'In piedi, alternato.'}],
    [{name:'French press su panca', type:'manubri_panca', mode:'reps', repsMin:12, repsMax:14, weight:5}]
  ]);
  mk('Bicipiti + tricipiti (cavi)', 3, 60, false, [
    [{name:'Curl bicipiti al cavo basso', type:'macchina', mode:'reps', repsMin:10, repsMax:12}],
    [{name:'Push down tricipiti al cavo', type:'macchina', mode:'reps', repsMin:10, repsMax:12}]
  ]);
  return t;
}

/* ---------- state + migrazione ---------- */
function blankState(){
  return {version:DATA_VERSION, activeDay:safeDay(todayKey()), modal:null, items:{}, history:{}, templates:seedTemplates(), updatedAt:0};
}
function isValidData(d){ return !!(d && typeof d==='object' && (d.items || d.exercises) && (d.history || d.logs)); }
function snapshot(spec, n, restSec){
  return {sets:n, mode:spec.mode, repsMin:spec.repsMin, repsMax:spec.repsMax, durationSec:spec.durationSec, weight:spec.weight,
    loaded:isLoaded(spec), weightStep:spec.weightStep, type:spec.type, perSide:!!spec.perSide, restSec:restSec ?? null};
}
function migrate(s){
  if(!s || typeof s!=='object') return blankState();
  if((s.version||0) >= 3){
    s.items = s.items || {}; s.history = s.history || {};
    if(!s.templates) s.templates = seedTemplates();
    s.activeDay = safeDay(s.activeDay);
    s.modal = null;
    return s;
  }
  // v2 -> v3: gli esercizi restano per giorno, lo storico diventa per esercizio (per nome)
  const items={}, history={};
  Object.values(s.exercises||{}).forEach(ex=>{
    const spec = makeSpec({name:ex.name, type:ex.type, mode:ex.mode, repsMin:ex.repsMin, repsMax:ex.repsMax,
      durationSec:ex.durationSec, weight:ex.weight, loaded:defaultLoaded(ex.type), note:ex.note});
    const item = {...spec, id:ex.id, kind:'exercise', day:safeDay(ex.day), order:ex.order||0, sets:ex.sets||3,
      restSec:ex.restSec ?? 60, createdAt:ex.createdAt||Date.now()};
    items[ex.id]=item;
    ((s.logs||{})[ex.id]||[]).forEach(l=>{
      const list = history[spec.exKey] || (history[spec.exKey]=[]);
      const entry = {date:l.date, day:item.day, itemId:ex.id, ctx:'exercise', name:spec.name,
        sets:(l.sets||[]).map(x=> x? {value:+x.value||0, kg:+x.kg||0} : null),
        fatigue:null, restFb:null, target:snapshot(item, item.sets, item.restSec)};
      list.push(entry);
    });
  });
  Object.values(history).forEach(l=>l.sort((a,b)=>a.date.localeCompare(b.date)));
  return {version:DATA_VERSION, activeDay:safeDay(s.activeDay), modal:null, items, history,
    templates:seedTemplates(), updatedAt:(s.updatedAt||0)+1};
}
function loadState(){
  let raw=null, s=null;
  try{ raw=localStorage.getItem(STORAGE_KEY); if(raw) s=JSON.parse(raw); }catch(e){ console.warn('Stato non leggibile', e); }
  if(s && (s.version||0)<3){ try{ localStorage.setItem(STORAGE_KEY+'_backup_v2', raw); }catch(e){} }
  const out = s? migrate(s) : blankState();
  const t=todayKey(); if(DAYS.includes(t)) out.activeDay=t;
  out.modal=null;
  return out;
}
function serializable(){ const {modal, ...rest}=state; return rest; }
function persistLocal(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(serializable())); }catch(e){ console.warn(e); } }
function saveState(){ state.updatedAt=Date.now(); persistLocal(); scheduleGithubAutoSync(); }

let state = loadState();
persistLocal();
const ui = {inputs:{}, openRounds:{}, analysis:{}, progOpen:null};

/* ---------- items + storico ---------- */
function dayItems(day){ return Object.values(state.items).filter(i=>i.day===day).sort((a,b)=>(a.order||0)-(b.order||0)); }
function histList(key){ return state.history[key] || []; }
function todayEntry(key, itemId){ const d=todayISO(); return histList(key).find(e=>e.date===d && e.itemId===itemId) || null; }
function ensureEntry(spec, item, n){
  let e = todayEntry(spec.exKey, item.id);
  if(!e){
    e = {date:todayISO(), day:item.day, itemId:item.id, ctx:item.kind, name:spec.name, sets:Array(n).fill(null),
      fatigue:null, restFb:null, target:snapshot(spec, n, item.restSec)};
    (state.history[spec.exKey] || (state.history[spec.exKey]=[])).push(e);
  }
  while(e.sets.length<n) e.sets.push(null);
  return e;
}
function doneSets(e){ return (e && e.sets || []).filter(s=>s && s.value>0); }
function maxKg(sets){ return sets.reduce((m,s)=>Math.max(m, (s && s.kg) || 0), 0); }
function isStDone(item, r, s){ const sp=activeSpec(item.stations[s]); const e=todayEntry(sp.exKey, item.id); return !!(e && e.sets[r]); }
function roundDone(item, r){ return item.stations.every((st,s)=>isStDone(item, r, s)); }
function currentRound(item){ for(let r=0;r<nFor(item);r++){ if(!roundDone(item,r)) return r; } return -1; }

/* Trova la definizione attuale di un esercizio (per nome) nella scheda o nei modelli */
function findSpecForKey(key){
  for(const it of Object.values(state.items)){
    if(it.kind==='exercise' && it.exKey===key) return {spec:it, n:nFor(it), restSec:it.restSec, itemId:it.id};
    if(it.kind==='circuit'){ for(const st of it.stations){ for(const o of st.options){ if(o.exKey===key) return {spec:o, n:nFor(it), restSec:it.restSec, itemId:it.id}; } } }
  }
  return null;
}
function knownSpec(key){
  const f=findSpecForKey(key); if(f) return clone(f.spec);
  for(const t of Object.values(state.templates)){ for(const st of t.stations){ for(const o of st.options){ if(o.exKey===key) return clone(o); } } }
  const p=EXERCISE_LIBRARY.find(x=>exKeyFor(x.name)===key); if(p) return makeSpec(p);
  const h=histList(key); if(h.length){ const t=h[h.length-1].target||{}; return makeSpec({...t, name:h[h.length-1].name}); }
  return null;
}

/* ---------- motore di progressione (doppia progressione + fatica + sensazione recupero) ---------- */
function analyze(spec, n, key, opts){
  opts = opts || {};
  const today = todayISO();
  const hist = histList(key).filter(e=>(opts.includeToday? e.date<=today : e.date<today) && doneSets(e).length).sort((a,b)=>a.date.localeCompare(b.date));
  const loaded = isLoaded(spec), step = +spec.weightStep || 0;
  const restSec = opts.restSec;
  const isTime = spec.mode==='time';
  const bottom = isTime? null : (spec.repsMin || spec.repsMax || 10);
  const top = isTime? null : Math.max(spec.repsMax || bottom, bottom);
  const defVal = isTime? (spec.durationSec||30) : bottom;
  const res = {kind:'new', weight: spec.weight || 0, targets:Array(n).fill(defVal), msg:'', action:null, actionLabel:''};
  if(!hist.length){
    res.msg = isTime? `Prima volta: punta a ${spec.durationSec}s su ogni serie.`
      : `Prima volta: scegli un carico con cui arrivi a ${repsLabel(spec)} ripetizioni lasciandone 1-2 di riserva.`;
    return res;
  }
  const last = hist[hist.length-1];
  const done = doneSets(last);
  const fat = last.fatigue, rf = last.restFb;
  const w = loaded? (maxKg(done) || spec.weight || 0) : 0;
  res.weight = w;
  const complete = done.length >= n;

  if(isTime){
    const t = spec.durationSec || 30;
    const allHit = complete && done.every(s=>s.value>=t);
    if(allHit && (fat==null || fat<=3 || rf==='long')){
      const nt = t + (t<30? 5 : t<90? 10 : 15);
      return {...res, kind:'up', targets:Array(n).fill(nt), msg:`Hai tenuto ${t}s su tutte le serie: la prossima volta passa a ${nt}s.`, action:{durationSec:nt}, actionLabel:`Imposta ${nt}s`};
    }
    if(allHit) return {...res, kind:'hold', targets:Array(n).fill(t), msg:`Obiettivo raggiunto ma al limite: resta a ${t}s finché non ti sembra più gestibile.`};
    return {...res, kind:'building', targets:Array(n).fill(t), msg:`Obiettivo: ${t}s su ogni serie.`};
  }

  const allTop = complete && done.every(s=>s.value>=top);
  if(allTop){
    const prev = hist[hist.length-2];
    const prevAllTop = prev && doneSets(prev).length>=n && doneSets(prev).every(s=>s.value>=top) && (!loaded || Math.abs(maxKg(doneSets(prev))-w)<0.01);
    const ready = fat==null || fat<=4 || rf==='long' || prevAllTop;
    if(ready){
      if(loaded && step>0){
        const nw = Math.round((w+step)*100)/100;
        const act = {weight:nw};
        if(restSec!=null && restSec<60) act.restSec = 60;
        let msg = `Hai chiuso ${n}×${top} con ${fmtKg(w)} kg: sali a ${fmtKg(nw)} kg e riparti da ${bottom} ripetizioni.`;
        if(act.restSec) msg += ' Recupero a 60s.';
        if(fat!=null && fat<=2) msg += ' Ti è sembrato facile: se serve puoi salire anche di più.';
        return {...res, kind:'up', weight:nw, targets:Array(n).fill(bottom), msg, action:act, actionLabel:`Imposta ${fmtKg(nw)} kg`};
      }
      return {...res, kind:'up', targets:Array(n).fill(top+2),
        msg:`Hai chiuso ${n}×${top}: alza il range a ${bottom+2}-${top+2}${spec.type==='elastico'? ' oppure usa un elastico più duro' : ' oppure passa a una variante più difficile'}.`,
        action:{repsMin:bottom+2, repsMax:top+2}, actionLabel:`Range ${bottom+2}-${top+2}`};
    }
    return {...res, kind:'hold', targets:Array(n).fill(top), msg:`Range chiuso ma al limite: ripeti ${n}×${top}${loaded? ` con ${fmtKg(w)} kg` : ''}, poi sali.`};
  }

  const targets=[];
  for(let i=0;i<n;i++){
    const s = last.sets[i];
    const prevV = s && s.value? s.value : bottom;
    const t = (fat!=null && fat>=5)? prevV : prevV+1;
    targets.push(Math.min(top, Math.max(bottom, t)));
  }
  let kind='building';
  let msg = `Obiettivo: ${targets.join(' · ')} rip${loaded && w? ` con ${fmtKg(w)} kg` : ''}. Aggiungi una ripetizione dove riesci.`;
  let action=null, actionLabel='';
  const sameW = hist.filter(e=>!loaded || Math.abs(maxKg(doneSets(e))-w)<0.01);
  const vol = e=>doneSets(e).reduce((a,s)=>a+s.value,0);
  const cutoff = new Date(last.date); cutoff.setDate(cutoff.getDate()-14);
  const cutoffISO = cutoff.toISOString().slice(0,10);
  const older = sameW.filter(e=>e.date<=cutoffISO);
  if(sameW.length>=3 && older.length){
    if(vol(last) <= Math.max(...older.map(vol))){
      kind='stall';
      const nw = loaded && w>0? roundStep(w*0.9, step||1) : null;
      msg = `Nessun progresso da oltre 2 settimane${loaded && w? ` con ${fmtKg(w)} kg` : ''}. In deficit può capitare: cura sonno e proteine.`
        + (nw && nw<w? ` Se continua, scendi a ${fmtKg(nw)} kg e risali.` : ' Se continua, cambia variante o abbassa il range.');
      if(nw && nw<w){ action={weight:nw}; actionLabel=`Imposta ${fmtKg(nw)} kg`; }
    }
  }
  if(kind==='building' && loaded && step>0 && w>step && complete && done.filter(s=>s.value<bottom-1).length>=Math.ceil(n/2)){
    const nw = Math.round((w-step)*100)/100;
    kind='down';
    msg = `Metà delle serie è sotto il range (${bottom}-${top}): valuta ${fmtKg(nw)} kg.`;
    action={weight:nw}; actionLabel=`Imposta ${fmtKg(nw)} kg`;
  }
  if(rf==='short' && restSec!=null){
    msg += ` Il recupero ti è sembrato corto: prova ${restSec+15}s.`;
    if(!action){ action={restSec:restSec+15}; actionLabel=`Recupero ${restSec+15}s`; }
  }
  return {...res, kind, targets, msg, action, actionLabel};
}
function hintHtml(a, cacheKey){
  if(!a || !a.msg) return '';
  const cls = a.kind==='up'? 'up' : (a.kind==='stall' || a.kind==='down')? 'warn' : 'info';
  const ico = a.kind==='up'? '⬆️' : a.kind==='stall'? '⚠️' : a.kind==='down'? '↘️' : '🎯';
  const btn = (a.action && cacheKey)? `<button class="hint-act" onclick="applyCached('${cacheKey}')">${esc(a.actionLabel)} nella scheda</button>` : '';
  return `<div class="hint ${cls}"><span class="hint-ico">${ico}</span><div>${esc(a.msg)}${btn? `<div>${btn}</div>`:''}</div></div>`;
}
function applyCached(cacheKey){
  const c=ui.analysis[cacheKey]; if(!c || !c.a.action) return;
  applyAction(c.key, c.a.action, c.itemId);
}
function applyAction(key, action, itemId){
  const {restSec, ...changes} = action;
  let count=0;
  if(Object.keys(changes).length){
    Object.values(state.items).forEach(it=>{
      if(it.kind==='exercise' && it.exKey===key){ Object.assign(it, changes); count++; }
      if(it.kind==='circuit') it.stations.forEach(st=>st.options.forEach(o=>{ if(o.exKey===key){ Object.assign(o, changes); count++; } }));
    });
    Object.values(state.templates).forEach(t=>t.stations.forEach(st=>st.options.forEach(o=>{ if(o.exKey===key) Object.assign(o, changes); })));
  }
  if(restSec!=null && itemId && state.items[itemId]) state.items[itemId].restSec = restSec;
  saveState(); renderApp();
  showToast(count>1? `Scheda aggiornata (${count} giornate)` : 'Scheda aggiornata');
}

/* ---------- metriche progressi ---------- */
function entryMetric(e, mode, loaded){
  const d=doneSets(e); if(!d.length) return 0;
  if(mode==='time') return Math.max(...d.map(s=>s.value));
  if(loaded && d.some(s=>s.kg>0)) return Math.max(...d.map(s=>(s.kg||0)*(1+s.value/30)));
  return d.reduce((a,s)=>a+s.value,0);
}
function metricLabel(mode, loaded){ return mode==='time'? 'tempo migliore (s)' : loaded? 'massimale stimato (kg)' : 'ripetizioni totali'; }
function fmtSets(e, mode, loaded){
  const d=(e.sets||[]).filter(Boolean);
  if(!d.length) return '—';
  const u = mode==='time'? 's' : '';
  if(!loaded) return d.map(s=>s.value+u).join(' · ') + (mode==='time'? '' : ' rip');
  const kgs=[...new Set(d.map(s=>s.kg||0))];
  if(kgs.length===1) return d.map(s=>s.value+u).join(' · ') + ` × ${fmtKg(kgs[0])} kg`;
  return d.map(s=>`${s.value}${u}×${fmtKg(s.kg||0)}`).join(' · ');
}
function buildProgressChart(values, dates, label){
  if(values.length<2) return '';
  const w=250,h=76,padL=26,padR=6,padT=10,padB=16;
  const max=Math.max(...values), min=Math.min(...values);
  const range=(max-min)||1;
  const stepX=(w-padL-padR)/(values.length-1);
  const pts=values.map((s,i)=>({x:padL+i*stepX, y:padT+(h-padT-padB)-((s-min)/range)*(h-padT-padB)}));
  const poly=pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const dots=pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.6" fill="currentColor"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" class="progress-chart" role="img" aria-label="Andamento: ${esc(label)}">
    <text x="2" y="${padT+4}" class="chart-label">${Math.round(max)}</text>
    <text x="2" y="${h-padB+2}" class="chart-label">${Math.round(min)}</text>
    <polyline points="${poly}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${padL}" y="${h-2}" class="chart-label">${fmtDate(dates[0])}</text>
    <text x="${w-padR}" y="${h-2}" text-anchor="end" class="chart-label">${fmtDate(dates[dates.length-1])}</text>
  </svg><div class="chart-caption">${esc(label)}</div>`;
}

/* ---------- rendering: card esercizio ---------- */
function rememberInput(el){ ui.inputs[el.id]=el.value; }
function inputVal(id, fallback){ return ui.inputs[id]!=null? ui.inputs[id] : fallback; }

function recentHistoryHtml(key, mode, loaded){
  const today=todayISO();
  const past = histList(key).filter(e=>e.date<today && doneSets(e).length).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
  if(!past.length) return '';
  return `<div class="history"><div class="history-list">${past.map(e=>`<div class="hist-line"><span>${fmtDate(e.date)}</span><span class="hist-sets">${esc(fmtSets(e, mode, loaded))}</span>${e.fatigue? `<span class="hist-stars" aria-label="Fatica ${e.fatigue} su 5">${starsText(e.fatigue)}</span>`:''}</div>`).join('')}</div></div>`;
}

function buildExerciseCard(item){
  const n=nFor(item), loaded=isLoaded(item), isTime=item.mode==='time';
  const e=todayEntry(item.exKey, item.id);
  const doneCount = e? e.sets.slice(0,n).filter(Boolean).length : 0;
  const allDone = doneCount>=n;
  const a = analyze(item, n, item.exKey, {includeToday:allDone, restSec:item.restSec});
  const cacheKey = item.exKey+'__'+item.id;
  ui.analysis[cacheKey] = {a, key:item.exKey, itemId:item.id};
  const firstOpen = e? e.sets.findIndex((s,j)=>j<n && !s) : 0;
  const cols = ['58px','1fr']; if(loaded) cols.push('1fr'); if(isTime) cols.push('44px'); cols.push('44px');
  let rows = `<div class="log-head" style="--cols:${cols.join(' ')}"><span></span><span>${isTime?'secondi':'ripetizioni'}${item.perSide&&!isTime?' / lato':''}</span>${loaded?'<span>kg</span>':''}${isTime?'<span></span>':''}<span></span></div>`;
  for(let i=0;i<n;i++){
    const s = e && e.sets[i];
    const vid=`v-${item.id}-${i}`, kid=`k-${item.id}-${i}`;
    let prevKg=null; if(e){ for(let j=i-1;j>=0;j--){ if(e.sets[j]){ prevKg=e.sets[j].kg; break; } } }
    const val = s? s.value : inputVal(vid, a.targets[i] ?? '');
    const kg = s? (s.kg||'') : inputVal(kid, prevKg || a.weight || item.weight || '');
    const isNext = !allDone && i===firstOpen;
    rows += `<div class="log-row ${s?'done':''} ${isNext?'next':''}" style="--cols:${cols.join(' ')}">
      <span class="set-label">Serie ${i+1}</span>
      <input type="number" inputmode="numeric" id="${vid}" value="${esc(val)}" oninput="rememberInput(this)" aria-label="${isTime?'Secondi':'Ripetizioni'} serie ${i+1}">
      ${loaded? `<input type="number" inputmode="decimal" step="0.5" id="${kid}" value="${esc(kg)}" placeholder="kg" oninput="rememberInput(this)" aria-label="Kg serie ${i+1}">` : ''}
      ${isTime? `<button class="play-btn" onclick="openReadySingle('${item.id}',${i})" aria-label="Avvia timer serie ${i+1}">${icon('play',16)}</button>` : ''}
      <button class="set-done-btn ${s?'is-done':''}" onclick="doneSingle('${item.id}',${i})" aria-label="Serie ${i+1} fatta">✓</button>
    </div>`;
  }
  const hint = (allDone || a.kind!=='new' || !histList(item.exKey).length)? hintHtml(a, cacheKey) : '';
  const progressTxt = allDone? `<span class="done-badge">Fatto</span>` : (doneCount? `<span class="count-badge">${doneCount}/${n}</span>` : '');
  return `<div class="exercise-card cat-${item.type} ${allDone?'is-complete':''}" id="card-${item.id}">
    <div class="ex-header">
      <div class="ex-icon cat-${item.type}">${iconFor(item.type)}</div>
      <div class="ex-title"><h3>${esc(item.name)} ${progressTxt}</h3><div class="type-label">${TYPE_LABELS[item.type]||''}</div></div>
      <div class="reorder-btns">
        <button onclick="moveItem('${item.id}',-1)" aria-label="Sposta su">${icon('chevronUp',11)}</button>

/* ---------- rendering: card circuito ---------- */
function buildCircuitCard(item){
  const n=nFor(item);
  const cur=currentRound(item);
  const allDone = cur===-1;
  const open = ui.openRounds[item.id]!=null? ui.openRounds[item.id] : cur;
  const specs = item.stations.map(activeSpec);
  const analyses = specs.map(sp=>{
    const a = analyze(sp, n, sp.exKey, {includeToday:allDone, restSec:item.restSec});
    const ck = sp.exKey+'__'+item.id;
    ui.analysis[ck] = {a, key:sp.exKey, itemId:item.id};
    return {a, ck};
  });
  const stList = item.stations.map((st,s)=>{
    const sp=specs[s], a=analyses[s].a;
    const tgt = specShort(sp, sp.mode==='time'? a.targets[0] : null, isLoaded(sp)? a.weight : null);
    const alts = st.options.length>1? `<div class="alt-toggle" role="group" aria-label="Scegli l'esercizio">${st.options.map((o,k)=>`<button class="${k===(st.active||0)?'on':''}" onclick="setAlt('${item.id}',${s},${k})">${esc(o.name)}</button>`).join('')}</div>` : '';
    return `<div class="st-line"><span class="st-num">${s+1}</span><div class="st-main"><div class="st-name">${esc(sp.name)}</div><div class="st-target">${esc(tgt)}</div>${alts}</div></div>`;
  }).join('');
  const hints = analyses.map((x,s)=> (['up','stall','down'].includes(x.a.kind))? hintHtml({...x.a, msg: specs[s].name+': '+x.a.msg}, x.ck) : '').join('');

  let rounds='';
  for(let r=0;r<n;r++){
    const rd = roundDone(item, r);
    if(r!==open){
      const sum = rd? specs.map(sp=>{ const e=todayEntry(sp.exKey,item.id); const v=e&&e.sets[r]; return v? (v.value+(sp.mode==='time'?'s':'')) : '–'; }).join(' · ') : (r===cur? 'in corso' : 'da fare');
      rounds += `<button class="round-line ${rd?'done':''}" onclick="openRound('${item.id}',${r})"><span>${rd?'✓ ':''}Giro ${r+1}</span><span class="round-sum">${sum}</span></button>`;
      continue;
    }
    let rows='';
    item.stations.forEach((st,s)=>{
      const sp=specs[s], loaded=isLoaded(sp), isTime=sp.mode==='time';
      const e=todayEntry(sp.exKey, item.id);
      const v=e && e.sets[r];
      const vid=`v-${item.id}-${r}-${s}`, kid=`k-${item.id}-${r}-${s}`;
      let prevKg=null; if(e){ for(let j=r-1;j>=0;j--){ if(e.sets[j]){ prevKg=e.sets[j].kg; break; } } }
      const a=analyses[s].a;
      const val = v? v.value : inputVal(vid, a.targets[r] ?? '');
      const kg = v? (v.kg||'') : inputVal(kid, prevKg || a.weight || sp.weight || '');
      const nextS = item.stations.findIndex((x,j)=>!isStDone(item, r, j));
      const isNext = !rd && s===nextS;
      rows += `<div class="c-row ${loaded?'':'nokg'} ${v?'done':''} ${isNext?'next':''}">
        <div class="c-name">${esc(sp.name)}<small>${isTime?'secondi':'rip'+(sp.perSide?' per lato':'')}${loaded?' · kg':''}</small></div>
        <input type="number" inputmode="numeric" id="${vid}" value="${esc(val)}" oninput="rememberInput(this)" aria-label="${esc(sp.name)} giro ${r+1}">
        ${loaded? `<input type="number" inputmode="decimal" step="0.5" id="${kid}" value="${esc(kg)}" placeholder="kg" oninput="rememberInput(this)" aria-label="Kg ${esc(sp.name)} giro ${r+1}">` : ''}
        ${isTime && !v? `<button class="play-btn" onclick="openReadyStation('${item.id}',${r},${s})" aria-label="Avvia ${esc(sp.name)}">${icon('play',16)}</button>`
          : `<button class="set-done-btn ${v?'is-done':''}" onclick="doneStation('${item.id}',${r},${s})" aria-label="${esc(sp.name)} fatto">✓</button>`}
      </div>`;
    });
    rounds += `<div class="round open"><div class="round-title">Giro ${r+1} di ${n}${rd?' · completato':''}</div>${rows}</div>`;
  }
  const e0 = specs.map(sp=>todayEntry(sp.exKey,item.id)).find(Boolean);
  const anyToday = !!e0;
  const fatDone = allDone && specs.every(sp=>{ const e=todayEntry(sp.exKey,item.id); return e && e.fatigue; });
  return `<div class="exercise-card circuit ${item.warmup?'warmup':''} ${allDone?'is-complete':''}" id="card-${item.id}">
    <div class="ex-header">
      <div class="ex-icon cat-circuit">${icon('repeat',20)}</div>
      <div class="ex-title"><h3>${esc(item.name)} ${allDone? '<span class="done-badge">Fatto</span>' : (cur>0? `<span class="count-badge">giro ${cur+1}/${n}</span>`:'')}</h3>
        <div class="type-label">${item.warmup? '<span class="badge-warm">Riscaldamento</span> ' : ''}${item.stations.length===2?'Superset':'Circuito'} · ${n} giri · recupero ${item.restSec}s dopo il giro</div></div>
      <div class="reorder-btns">
        <button onclick="moveItem('${item.id}',-1)" aria-label="Sposta su">${icon('chevronUp',11)}</button>
        <button onclick="moveItem('${item.id}',1)" aria-label="Sposta giù">${icon('chevronDown',11)}</button>
      </div>
      <button class="icon-btn" onclick="openCircuitEditor('${item.id}')" aria-label="Modifica circuito">${icon('edit',14)}</button>
    </div>
    ${item.note? `<div class="note-box"><p>${esc(item.note)}</p></div>` : ''}
    <div class="st-list">${stList}</div>
    ${hints}
    <div class="rounds">${rounds}</div>
    <div class="card-foot">
      <button class="foot-btn" onclick="manualRest('${item.id}')">${icon('timer',15)} Recupero</button>
      ${allDone? `<button class="foot-btn ${fatDone?'stars':''}" onclick="openFatigue('${item.id}')">${fatDone? 'Fatica ✓' : 'Valuta fatica'}</button>`:''}
      <span class="foot-spacer"></span>
      <button class="foot-btn icon-only" onclick="saveItemAsTemplate('${item.id}')" aria-label="Salva come modello">${icon('save',15)}</button>
      <button class="foot-btn icon-only" onclick="openCopyModal('${item.id}')" aria-label="Copia in un altro giorno">${icon('copy',15)}</button>
      ${anyToday? `<button class="foot-btn icon-only warn" onclick="deleteTodayLog('${item.id}')" aria-label="Cancella la registrazione di oggi">${icon('trash',15)}</button>`:''}
    </div>
  </div>`;
}

function filterLibraryItems(){
  const filter = (state.modal && state.modal.filter) || 'all';
  const search = ((state.modal && state.modal.search) || '').toLowerCase().trim();
  const searchNorm = search.replace(/\s+/g,'');
  let items = EXERCISE_LIBRARY.filter(p=> filter==='all' || p.type===filter);
  if(search) items = items.filter(p=>{
    const nameLower=p.name.toLowerCase(), noteLower=(p.note||'').toLowerCase();
    return nameLower.includes(search) || noteLower.includes(search) || nameLower.replace(/\s+/g,'').includes(searchNorm);
  });
  return items;
}

            : `<div class="field"><label>Rip. min</label><input type="number" inputmode="numeric" value="${o.repsMin ?? ''}" oninput="cdOpt(${s},${k},'repsMin',this.value,true)"></div>
               <div class="field"><label>Rip. max</label><input type="number" inputmode="numeric" value="${o.repsMax ?? ''}" oninput="cdOpt(${s},${k},'repsMax',this.value,true)"></div>`}

                     <div class="field"><label>Aumento</label><input type="number" inputmode="decimal" step="0.5" value="${o.weightStep ?? 0}" oninput="cdOpt(${s},${k},'weightStep',this.value,true)"></div>` : ''}
        </div>

        </div>

    }).join('');
    return `<div class="st-edit">
      <div class="st-edit-head"><span>Esercizio ${s+1}</span><span class="st-edit-tools">
        <button type="button" class="icon-mini" onclick="cdMoveStation(${s},-1)" aria-label="Sposta su">${icon('chevronUp',12)}</button>

      </span></div>

      <button type="button" class="mini-btn" onclick="cdAddAlt(${s})">+ Alternativa (oppure…)</button>

  }).join('');
  return `<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal" data-mtype="circuit">

function openCircuitEditor(itemId, tplId){
  const returnTo = state.modal && state.modal.type==='circuitPick'? 'circuitPick' : null;
  if(itemId && state.items[itemId]){
    state.modal={type:'circuit', target:'item', editingId:itemId, draft:clone(state.items[itemId]), saveAsTemplate:false, returnTo};
  } else if(tplId && state.templates[tplId]){
    state.modal={type:'circuit', target:'template', editingId:tplId, draft:clone(state.templates[tplId]), returnTo};
  } else {
    state.modal={type:'circuit', target:'item', editingId:null, saveAsTemplate:true, returnTo,
      draft:{name:'', rounds:3, restSec:60, warmup:false, day:state.activeDay, note:'', stations:[newStation(), newStation()]}};
  }
  renderApp();
}
function closeCircuitEditor(){
  const r = state.modal && state.modal.returnTo;
  if(r==='circuitPick'){ state.modal={type:'circuitPick', daysFor:null, days:[]}; renderApp(); } else closeModal();
}
function cdSet(field, value, isNum){ const d=state.modal.draft; d[field] = isNum? parseInt(value)||0 : value; }
function cdOpt(s,k,field,value,isNum){ const o=state.modal.draft.stations[s].options[k]; o[field] = isNum? numOrNull(value) : value; }
function cdOptName(s,k,value){
  const o=state.modal.draft.stations[s].options[k];
  o.name=value;
  if(o.fresh){
    const known = knownSpec(exKeyFor(value));
    if(known){ Object.assign(o, {type:known.type, mode:known.mode, repsMin:known.repsMin, repsMax:known.repsMax, durationSec:known.durationSec, weight:known.weight, perSide:known.perSide, loaded:known.loaded, weightStep:known.weightStep}); }
    o.fresh=false;
    renderApp();
  }
}
function cdOptType(s,k,t){ const o=state.modal.draft.stations[s].options[k]; o.type=t; o.loaded=defaultLoaded(t); o.weightStep=DEFAULT_STEP[t] ?? 0; renderApp(); }
function cdOptMode(s,k,mode){ const o=state.modal.draft.stations[s].options[k]; o.mode=mode; if(mode==='time'){ o.durationSec=o.durationSec||30; } else { o.repsMin=o.repsMin||10; o.repsMax=o.repsMax||o.repsMin; } renderApp(); }
function cdOptLoaded(s,k,v){ const o=state.modal.draft.stations[s].options[k]; o.loaded=v; if(v && !o.weightStep) o.weightStep=2; renderApp(); }
function cdAddAlt(s){ state.modal.draft.stations[s].options.push(blankOption()); renderApp(); }
function cdRemoveAlt(s,k){ const st=state.modal.draft.stations[s]; st.options.splice(k,1); st.active=0; renderApp(); }
function cdAddStation(){ state.modal.draft.stations.push(newStation()); renderApp(); }
function cdRemoveStation(s){ state.modal.draft.stations.splice(s,1); renderApp(); }
function cdMoveStation(s,dir){ const a=state.modal.draft.stations; const t=s+dir; if(t<0||t>=a.length) return; [a[s],a[t]]=[a[t],a[s]]; renderApp(); }

function cleanDraftStations(d){
  return d.stations.map(st=>({sid:st.sid||uid('st'), active:st.active||0, options:st.options.filter(o=>(o.name||'').trim()).map(o=>{
    const spec = makeSpec({...o, name:o.name.trim()});
    spec.note = o.note || '';
    return spec;
  })})).filter(st=>st.options.length).map(st=>({...st, active:Math.min(st.active, st.options.length-1)}));
}
function saveCircuit(){
  const m=state.modal, d=m.draft;
  const name=(d.name||'').trim();
  if(!name){ alert('Dai un nome al circuito.'); return; }
  const stations=cleanDraftStations(d);
  if(!stations.length){ alert('Aggiungi almeno un esercizio con il nome.'); return; }
  const fields={name, rounds:Math.max(1, parseInt(d.rounds)||1), restSec:Math.max(0, parseInt(d.restSec)||0), warmup:!!d.warmup, note:(d.note||'').trim(), stations};
  if(m.target==='template'){
    const id=m.editingId || uid('tpl');
    state.templates[id]={id, ...fields};
    saveState();
    showToast('Modello salvato');
    state.modal={type:'circuitPick', daysFor:null, days:[]};
    renderApp();
    return;
  }
  const day=safeDay(d.day);
  if(m.editingId && state.items[m.editingId]){
    Object.assign(state.items[m.editingId], fields, {day});
  } else {
    const id=uid('ci');
    const list=dayItems(day);
    const order = fields.warmup? (list.length? Math.min(...list.map(i=>i.order||0))-1 : 1) : (list.length? Math.max(...list.map(i=>i.order||0))+1 : 1);
    state.items[id]={id, kind:'circuit', ...fields, day, order, createdAt:Date.now()};
  }
  if(m.saveAsTemplate){ const tid=uid('tpl'); state.templates[tid]={id:tid, ...clone(fields)}; }
  saveState();
  state.modal=null; state.activeDay=day;
  renderApp();
  showToast(m.saveAsTemplate? 'Circuito salvato, anche come modello' : 'Circuito salvato');
}
function insertTemplate(tplId, days){
  const t=state.templates[tplId]; if(!t) return;
  if(!days || !days.length){ showToast('Scegli almeno un giorno'); return; }
  days.forEach(day=>{
    const list=dayItems(day);
    const order = t.warmup? (list.length? Math.min(...list.map(i=>i.order||0))-1 : 1) : (list.length? Math.max(...list.map(i=>i.order||0))+1 : 1);
    const id=uid('ci');
    const c=clone(t); delete c.id;
    c.stations.forEach(st=>st.sid=uid('st'));
    state.items[id]={...c, id, kind:'circuit', day, order, tplId, createdAt:Date.now()};
  });
  saveState();
  state.modal=null;
  if(days.length===1) state.activeDay=days[0];
  renderApp();
  showToast(`"${t.name}" inserito in ${days.join(', ')}`);
}
function toggleTplDays(id){ const m=state.modal; m.daysFor = m.daysFor===id? null : id; m.days=[state.activeDay]; renderApp(); }
function toggleTplDay(d){ const m=state.modal; m.days = m.days.includes(d)? m.days.filter(x=>x!==d) : [...m.days, d]; renderApp(); }
function deleteTemplate(id){
  const t=state.templates[id]; if(!t) return;
  if(!confirm(`Eliminare il modello "${t.name}"? I circuiti già inseriti nella scheda restano.`)) return;
  delete state.templates[id]; saveState(); renderApp(); showToast('Modello eliminato');
}
function saveItemAsTemplate(itemId){
  const it=state.items[itemId]; if(!it || it.kind!=='circuit') return;
  const tid=uid('tpl');
  const c=clone(it);
  state.templates[tid]={id:tid, name:c.name, rounds:c.rounds, restSec:c.restSec, warmup:!!c.warmup, note:c.note||'', stations:c.stations};
  saveState(); showToast('Salvato tra i modelli');
}

/* ----- progressi per esercizio ----- */
function progressRows(){
  return Object.keys(state.history).map(key=>{
    const entries = histList(key).filter(e=>doneSets(e).length).sort((a,b)=>a.date.localeCompare(b.date));
    if(!entries.length) return null;
    const found = findSpecForKey(key);
    const lastE = entries[entries.length-1];
    const spec = found? found.spec : makeSpec({...(lastE.target||{}), name:lastE.name});
    const n = found? found.n : ((lastE.target && lastE.target.sets) || doneSets(lastE).length);
    const a = analyze(spec, n, key, {includeToday:true, restSec: found? found.restSec : (lastE.target && lastE.target.restSec)});
    return {key, entries, spec, n, a, inScheda:!!found, itemId: found && found.itemId, name: found? spec.name : lastE.name};
  }).filter(Boolean).sort((a,b)=>b.entries[b.entries.length-1].date.localeCompare(a.entries[a.entries.length-1].date));
}
function buildActivityBarChart(){
  const days=14, today=new Date(), buckets=[];
  for(let i=days-1;i>=0;i--){
    const d=new Date(today); d.setDate(d.getDate()-i);
    const local=new Date(d.getTime()-d.getTimezoneOffset()*60000);
    const iso=local.toISOString().slice(0,10);
    let count=0;
    Object.values(state.history).forEach(l=>{ if(l.some(e=>e.date===iso && doneSets(e).length)) count++; });
    buckets.push({date:iso, count});
  }
  const max=Math.max(1, ...buckets.map(b=>b.count));
  const w=280, h=90, padB=16, gap=3, barW=(w/days)-gap;
  const bars=buckets.map((b,i)=>{
    const x=i*(w/days)+gap/2;
    const bh = b.count? Math.max(5,(b.count/max)*(h-padB-8)) : 3;
    return `<rect x="${x.toFixed(1)}" y="${(h-padB-bh).toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="currentColor" opacity="${b.count?1:0.18}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" class="progress-chart" role="img" aria-label="Esercizi svolti negli ultimi 14 giorni">
    ${bars}
    <text x="${(barW/2).toFixed(1)}" y="${h-2}" class="chart-label">${fmtDate(buckets[0].date)}</text>
    <text x="${(w-barW/2).toFixed(1)}" y="${h-2}" text-anchor="end" class="chart-label">${fmtDate(buckets[buckets.length-1].date)}</text>
  </svg>`;
}
function renderProgressModal(){
  const rows=progressRows();
  const weekAgo=new Date(); weekAgo.setDate(weekAgo.getDate()-6);
  const weekAgoISO=new Date(weekAgo.getTime()-weekAgo.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const trained=new Set();
  Object.values(state.history).forEach(l=>l.forEach(e=>{ if(e.date>=weekAgoISO && doneSets(e).length) trained.add(e.date); }));
  const upCount=rows.filter(r=>r.a.kind==='up').length;
  const stallCount=rows.filter(r=>r.a.kind==='stall'||r.a.kind==='down').length;

    : `<span class="progress-badge neutral">In corso</span>`;
  const items = rows.map(r=>{
    const loaded=isLoaded(r.spec);

    ui.analysis[ck]={a:r.a, key:r.key, itemId:r.itemId};
    const detail = open? `<div class="prog-detail">
        ${hintHtml(r.a, r.inScheda? ck : null)}
        ${buildProgressChart(values, dates, metricLabel(r.spec.mode, loaded))}
        <div class="sess-list">${r.entries.slice().reverse().slice(0,12).map(e=>`<div class="sess"><span>${fmtDate(e.date)} <small>${DAY_FULL[e.day]? e.day : ''}</small></span><span class="sess-sets">${esc(fmtSets(e, r.spec.mode, loaded))}</span><span class="sess-stars">${e.fatigue? starsText(e.fatigue):''}</span></div>`).join('')}</div>
        ${!r.inScheda? `<p class="settings-help">Non è più nella scheda: lo storico resta qui.</p>`:''}
        <button class="link-danger" onclick="deleteHistory('${r.key}')">Elimina lo storico di questo esercizio</button>
      </div>` : '';
    return `<div class="progress-item ${open?'open':''}">
      <button class="progress-item-head" onclick="toggleProg('${r.key}')" aria-expanded="${open}">
        <div class="ex-icon cat-${r.spec.type}">${iconFor(r.spec.type)}</div>
        <div style="flex:1;min-width:0;text-align:left;">
          <div class="progress-item-name">${esc(r.name)}</div>

        </div>
        ${badge(r.a)}
      </button>
      ${detail}
    </div>`;
  }).join('');
  return `<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal" data-mtype="progress">
    <h2>Progressi</h2>
    <div class="stats-grid">

function renameKey(oldK, newK, newName){
  if(oldK===newK) return;
  const moved=(state.history[oldK]||[]).map(e=>({...e, name:newName}));
  state.history[newK]=(state.history[newK]||[]).concat(moved).sort((a,b)=>a.date.localeCompare(b.date));
  delete state.history[oldK];
  Object.values(state.items).forEach(it=>{
    if(it.kind==='exercise' && it.exKey===oldK){ it.exKey=newK; it.name=newName; }
    if(it.kind==='circuit') it.stations.forEach(st=>st.options.forEach(o=>{ if(o.exKey===oldK){ o.exKey=newK; o.name=newName; } }));
  });
  Object.values(state.templates).forEach(t=>t.stations.forEach(st=>st.options.forEach(o=>{ if(o.exKey===oldK){ o.exKey=newK; o.name=newName; } })));
}
function saveExercise(event){
  event.preventDefault();
  const name=$('f-name').value.trim();
  if(!name){ alert('Inserisci il nome dell\'esercizio'); return false; }
  const type=$('f-type').value, day=$('f-day').value, mode=$('f-mode').value;
  const sets=Math.max(1, parseInt($('f-sets').value)||1);
  const restSec=Math.max(0, parseInt($('f-rest').value)||0);
  const loaded=$('f-loaded').checked;
  let repsMin=null, repsMax=null, durationSec=null;
  if(mode==='time'){ durationSec=Math.max(5, parseInt($('f-duration').value)||30); }
  else {
    repsMin=parseInt($('f-repsmin').value)||1;
    repsMax=parseInt($('f-repsmax').value)||repsMin;
    if(repsMin>repsMax){ alert('Le ripetizioni minime non possono superare le massime'); return false; }
  }
  const spec=makeSpec({name, type, mode, repsMin, repsMax, durationSec, weight:loaded? numOrNull($('f-weight').value) : null,
    perSide:$('f-perside').checked, loaded, weightStep:loaded? num($('f-step').value) : 0, note:$('f-note').value.trim()});
  const editingId=state.modal.editingId;
  if(editingId && state.items[editingId]){
    const prev=state.items[editingId];
    if(prev.exKey!==spec.exKey && histList(prev.exKey).length){
      const keep=confirm(`Hai rinominato "${prev.name}" in "${name}".\n\nOK: è lo stesso esercizio, tengo lo storico (e rinomino anche negli altri giorni).\nAnnulla: è un esercizio diverso, storico separato.`);
      if(keep) renameKey(prev.exKey, spec.exKey, name);
    }
    Object.assign(state.items[editingId], spec, {day, sets, restSec});
  } else {
    const id=uid('ex');
    const list=dayItems(day);
    const order=list.length? Math.max(...list.map(e=>e.order||0))+1 : 1;
    state.items[id]={...spec, id, kind:'exercise', day, order, sets, restSec, createdAt:Date.now()};
  }
  saveState();
  state.modal=null; state.activeDay=day;
  renderApp();
  showToast('Esercizio salvato');
  return false;
}
function deleteItem(id){
  const it=state.items[id]; if(!it) return;
  if(!confirm(`Togliere "${it.name}" dalla scheda di ${DAY_FULL[it.day]}?\nLo storico resta nei Progressi.`)) return;
  delete state.items[id];
  saveState(); state.modal=null; renderApp(); showToast('Tolto dalla scheda');
}
function confirmDeleteFromSwipe(id){ deleteItem(id); }
function addFromPreset(presetId){
  const p=EXERCISE_LIBRARY.find(x=>x.id===presetId); if(!p) return;
  const known = knownSpec(exKeyFor(p.name));
  const spec = known && known.weight? known : makeSpec(p);
  const id=uid('ex');
  const list=dayItems(state.activeDay);
  const order=list.length? Math.max(...list.map(e=>e.order||0))+1 : 1;
  state.items[id]={...spec, note:spec.note||p.note, id, kind:'exercise', day:state.activeDay, order, sets:p.sets, restSec:p.restSec, createdAt:Date.now()};
  saveState(); state.modal=null; renderApp(); showToast('Aggiunto: '+p.name);
}
function moveItem(id, dir){
  const it=state.items[id]; if(!it) return;
  const list=dayItems(it.day);
  list.forEach((x,i)=>x.order=i+1);
  const idx=list.findIndex(x=>x.id===id), t=idx+dir;
  if(t<0 || t>=list.length) return;
  const tmp=list[idx].order; list[idx].order=list[t].order; list[t].order=tmp;
  saveState(); renderApp();
}
function copyItemToDay(id, day){
  const it=state.items[id]; if(!it) return;
  const list=dayItems(day);
  const order = it.warmup? (list.length? Math.min(...list.map(i=>i.order||0))-1 : 1) : (list.length? Math.max(...list.map(e=>e.order||0))+1 : 1);
  const nid=uid(it.kind==='circuit'?'ci':'ex');
  state.items[nid]={...clone(it), id:nid, day, order, createdAt:Date.now()};
  saveState(); state.modal=null; renderApp(); showToast('Copiato in '+DAY_FULL[day]);
}
function duplicateDayTo(src, dst){
  const list=dayItems(src); if(!list.length) return;
  const existing=dayItems(dst);
  if(existing.length && !confirm(`${DAY_FULL[dst]} ha già ${existing.length} elementi. Aggiungere comunque una copia di ${DAY_FULL[src]}?`)) return;
  let maxOrder=existing.length? Math.max(...existing.map(e=>e.order||0)) : 0;
  list.forEach(it=>{ maxOrder++; const nid=uid(it.kind==='circuit'?'ci':'ex'); state.items[nid]={...clone(it), id:nid, day:dst, order:maxOrder, createdAt:Date.now()}; });
  saveState(); state.modal=null; renderApp(); showToast('Giornata duplicata su '+DAY_FULL[dst]);
}
function deleteTodayLog(itemId){
  const it=state.items[itemId]; if(!it) return;
  if(!confirm(`Cancellare quanto registrato oggi per "${it.name}"?`)) return;
  const d=todayISO();
  const keys = it.kind==='circuit'? [...new Set(it.stations.flatMap(st=>st.options.map(o=>o.exKey)))] : [it.exKey];
  keys.forEach(k=>{ if(state.history[k]){ state.history[k]=state.history[k].filter(e=>!(e.date===d && e.itemId===itemId)); if(!state.history[k].length) delete state.history[k]; } });
  Object.keys(ui.inputs).forEach(k=>{ if(k.includes(itemId)) delete ui.inputs[k]; });
  delete ui.openRounds[itemId];
  saveState(); renderApp(); showToast('Registrazione di oggi cancellata');
}

/* ---------- flusso di allenamento ---------- */
function readVal(id){ const el=$(id); return el? num(el.value) : 0; }
function flashRow(id){ const el=$(id); const row=el && el.closest('.log-row, .c-row'); if(row){ row.classList.add('flash'); setTimeout(()=>row.classList.remove('flash'),650); } }

function doneSingle(itemId, i){ commitSingle(itemId, i, readVal(`v-${itemId}-${i}`)); }
function commitSingle(itemId, i, value){
  unlockAudio(); keepAwake();
  const it=state.items[itemId]; if(!it) return;
  if(!value){ showToast(it.mode==='time'? 'Inserisci i secondi fatti' : 'Inserisci le ripetizioni fatte'); const el=$(`v-${itemId}-${i}`); if(el) el.focus(); return; }
  const n=nFor(it);
  const kg = isLoaded(it)? readVal(`k-${itemId}-${i}`) : 0;
  const e=ensureEntry(it, it, n);
  const wasDone=!!e.sets[i];
  e.sets[i]={value, kg};
  delete ui.inputs[`v-${itemId}-${i}`]; delete ui.inputs[`k-${itemId}-${i}`];
  saveState(); renderApp(); flashRow(`v-${itemId}-${i}`);
  if(wasDone){ showToast('Serie aggiornata'); return; }
  const next=e.sets.findIndex((s,j)=>j<n && !s);
  if(next===-1){ stopTimer(true); openFatigue(itemId); return; }
  const a=ui.analysis[it.exKey+'__'+itemId];
  const tv = a? a.a.targets[next] : null;
  startTimer({kind:'rest', seconds:it.restSec, label:'Recupero', name:it.name,
    next:`<strong>Serie ${next+1} di ${n}</strong> · ${esc(specShort(it, tv, kg||null))}`,
    onEnd:()=>{ if(it.mode==='time') openReadySingle(itemId, next); }});
}
function doneStation(itemId, r, s){ commitStation(itemId, r, s, readVal(`v-${itemId}-${r}-${s}`)); }
function commitStation(itemId, r, s, value){
  unlockAudio(); keepAwake();
  const it=state.items[itemId]; if(!it) return;
  const sp=activeSpec(it.stations[s]);
  if(!value){ showToast(sp.mode==='time'? 'Inserisci i secondi fatti' : 'Inserisci le ripetizioni fatte'); return; }
  const kg = isLoaded(sp)? readVal(`k-${itemId}-${r}-${s}`) : 0;
  const e=ensureEntry(sp, it, nFor(it));
  const wasDone=!!e.sets[r];
  e.sets[r]={value, kg};
  delete ui.inputs[`v-${itemId}-${r}-${s}`]; delete ui.inputs[`k-${itemId}-${r}-${s}`];
  saveState();
  if(wasDone){ renderApp(); flashRow(`v-${itemId}-${r}-${s}`); showToast('Aggiornato'); return; }
  flowAfterStation(it, r, s);
}
function flowAfterStation(it, r, s){
  const n=nFor(it);
  const ns = it.stations.findIndex((st,j)=>!isStDone(it, r, j));
  if(ns!==-1){
    ui.openRounds[it.id]=r;
    renderApp(); flashRow(`v-${it.id}-${r}-${s}`);
    const sp=activeSpec(it.stations[ns]);
    if(sp.mode==='time') openReadyStation(it.id, r, ns);
    else { showToast(`Vai: ${sp.name}`); scrollToRow(`v-${it.id}-${r}-${ns}`); }
    return;
  }
  const nr = currentRound(it);
  if(nr===-1){ delete ui.openRounds[it.id]; renderApp(); stopTimer(true); openFatigue(it.id); return; }
  ui.openRounds[it.id]=nr;
  renderApp(); flashRow(`v-${it.id}-${r}-${s}`);
  const fs = it.stations.findIndex((st,j)=>!isStDone(it, nr, j));
  const first=activeSpec(it.stations[fs]);
  startTimer({kind:'rest', seconds:it.restSec, label:`Recupero · giro ${r+1} di ${n} fatto`, name:it.name,
    next:`<strong>Giro ${nr+1} di ${n}</strong> · ${esc(first.name)}, ${esc(specShort(first))}`,
    onEnd:()=>{ if(first.mode==='time') openReadyStation(it.id, nr, fs); else scrollToRow(`v-${it.id}-${nr}-${fs}`); }});
}
function scrollToRow(id){ const el=$(id); if(el){ const row=el.closest('.log-row, .c-row'); (row||el).scrollIntoView({behavior:'smooth', block:'center'}); } }
function manualRest(itemId){
  unlockAudio();
  const it=state.items[itemId]; if(!it) return;
  startTimer({kind:'rest', seconds:it.restSec, label:'Recupero', name:it.name, next:''});
}

/* ---------- overlay a tutto schermo ---------- */
let ov=null, lastOvKey=null;
function renderOverlay(){
  const root=$('overlay-root'); if(!root) return;
  const ovKey = ov? ov.type+(ov.mini?'-mini':'') : null;
  const animate = ovKey!==lastOvKey;
  lastOvKey = ovKey;
  document.body.classList.remove('ov-open','ov-mini');
  if(!ov){ root.innerHTML=''; return; }
  if(ov.type==='timer' && ov.mini){ document.body.classList.add('ov-mini'); root.innerHTML=miniTimerHtml(); updateTimerDisplay(); return; }
  document.body.classList.add('ov-open');
  let html='';
  if(ov.type==='timer') html=timerHtml();
  else if(ov.type==='ready') html=readyHtml();
  else if(ov.type==='go') html=goHtml();
  else if(ov.type==='fatigue') html=fatigueHtml();
  else if(ov.type==='summary') html=summaryHtml();
  root.innerHTML=html;
  const fs=root.querySelector('.fs-overlay'); if(fs && !animate) fs.style.animation='none';
  if(ov.type==='timer') updateTimerDisplay();
  const focusEl=root.querySelector('[data-autofocus]'); if(focusEl) focusEl.focus({preventScroll:true});
}
function closeOverlay(){ ov=null; renderOverlay(); }

    <div class="fs-label">${esc(t.label)}</div>
    <div class="fs-name">${esc(t.name)}</div>
    <div class="ring-wrap">
      <svg viewBox="0 0 260 260" aria-hidden="true"><circle class="ring-bg" cx="130" cy="130" r="120"/><circle id="t-ring" class="ring-fg" cx="130" cy="130" r="120" stroke-dasharray="${RING_C.toFixed(1)}" stroke-dashoffset="0"/></svg>

      : `<button class="fs-primary" data-autofocus onclick="skipTimer()">Salta recupero</button>`}

function miniTimerHtml(){
  const t=activeTimer; if(!t) return '';

function goHtml(){

    work:{kind:'work', seconds:secs, name, label, next:'', ctx, onEnd:(val)=>commitWork(ctx, val)}});
}
function recordReadyManual(){ const ctx=ov.ctx, v=ov.seconds; ov=null; renderOverlay(); commitWork(ctx, v); }
function commitWork(ctx, value){
  if(ctx.station!=null){ const el=$(`v-${ctx.itemId}-${ctx.round}-${ctx.station}`); if(el) el.value=value; commitStation(ctx.itemId, ctx.round, ctx.station, value); }
  else { const el=$(`v-${ctx.itemId}-${ctx.set}`); if(el) el.value=value; commitSingle(ctx.itemId, ctx.set, value); }
}

/* ----- motore timer ----- */
let activeTimer=null, timerInterval=null;
function startTimer(opts){
  clearInterval(timerInterval);
  const secs=Math.max(0, opts.seconds||0);
  activeTimer={...opts, total:secs, endTime:Date.now()+secs*1000, paused:false, pausedRemaining:null, lastTick:null, startedAt:Date.now()};
  const keepMini = opts.kind==='rest' && ov && ov.type==='timer' && ov.mini;
  ov={type:'timer', mini:keepMini};
  keepAwake();
  renderOverlay();
  if(secs<=0){ finishTimer(); return; }
  timerInterval=setInterval(tickTimer, 200);
}
function remainingSec(){ if(!activeTimer) return 0; if(activeTimer.paused) return activeTimer.pausedRemaining; return Math.max(0,(activeTimer.endTime-Date.now())/1000); }
function tickTimer(){
  if(!activeTimer || activeTimer.paused) return;
  const rem=remainingSec(), whole=Math.ceil(rem);
  if(whole>=1 && whole<=3 && activeTimer.lastTick!==whole){ activeTimer.lastTick=whole; if(activeTimer.kind==='prep' || ticksOn()) playSound('tick'); }
  updateTimerDisplay();
  if(rem<=0) finishTimer();
}
function finishTimer(){
  const t=activeTimer; if(!t) return;
  clearInterval(timerInterval); timerInterval=null; activeTimer=null;
  if(t.kind==='prep'){ playSound('go'); startTimer(t.work); return; }
  playSound('end');
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
  if(t.kind==='work'){ ov=null; renderOverlay(); t.onEnd && t.onEnd(t.total); return; }
  ov={type:'go', next:t.next};
  renderOverlay();
  setTimeout(()=>{ if(ov && ov.type==='go'){ ov=null; renderOverlay(); } t.onEnd && t.onEnd(); }, 1200);
}
function updateTimerDisplay(){
  if(!activeTimer) return;
  const rem=remainingSec(), whole=Math.ceil(rem);
  const txt = activeTimer.kind==='prep'? String(Math.max(1,whole)) : String(Math.floor(whole/60)).padStart(2,'0')+':'+String(whole%60).padStart(2,'0');
  const el=$('t-time'); if(el){ el.textContent=txt; el.classList.toggle('warn', activeTimer.kind!=='prep' && whole<=5); }
  const mini=$('tm-time'); if(mini){ mini.textContent=txt; mini.classList.toggle('warn', whole<=5); }
  const ring=$('t-ring'); if(ring){ const frac=activeTimer.total? rem/activeTimer.total : 0; ring.style.strokeDashoffset=(RING_C*(1-Math.min(1,frac))).toFixed(1); }
  const btn=$('t-pause'); if(btn) btn.textContent=activeTimer.paused? 'Riprendi' : 'Pausa';
}
function adjustTimer(delta){
  if(!activeTimer) return;
  if(activeTimer.paused) activeTimer.pausedRemaining=Math.max(1, activeTimer.pausedRemaining+delta);
  else { activeTimer.endTime=Math.max(Date.now()+1000, activeTimer.endTime+delta*1000); }
  activeTimer.total=Math.max(activeTimer.total+delta, remainingSec());
  activeTimer.lastTick=null;
  updateTimerDisplay();
}
function togglePauseTimer(){
  if(!activeTimer) return;
  if(!activeTimer.paused){ activeTimer.pausedRemaining=remainingSec(); activeTimer.paused=true; }
  else { activeTimer.endTime=Date.now()+activeTimer.pausedRemaining*1000; activeTimer.paused=false; }
  updateTimerDisplay();
}
function skipTimer(){
  const t=activeTimer; if(!t) return;
  clearInterval(timerInterval); timerInterval=null; activeTimer=null;
  ov=null; renderOverlay();
  if(t.kind==='rest' && t.onEnd) t.onEnd();
}
function finishWorkEarly(){
  const t=activeTimer; if(!t || t.kind!=='work') return;
  const elapsed=Math.max(1, Math.round(t.total-remainingSec()));
  clearInterval(timerInterval); timerInterval=null; activeTimer=null;
  ov=null; renderOverlay();
  t.onEnd && t.onEnd(elapsed);
}
function cancelWork(){ clearInterval(timerInterval); timerInterval=null; activeTimer=null; ov=null; renderOverlay(); }
function stopTimer(silent){ clearInterval(timerInterval); timerInterval=null; activeTimer=null; if(ov && ov.type==='timer'){ ov=null; renderOverlay(); } }

/* ----- valutazione fatica ----- */
function openFatigue(itemId){
  const it=state.items[itemId]; if(!it) return;
  let specs = it.kind==='circuit'? it.stations.map(activeSpec) : [it];
  const seen=new Set();
  specs = specs.filter(sp=>{ if(seen.has(sp.exKey)) return false; seen.add(sp.exKey); return !!todayEntry(sp.exKey, itemId); });
  if(!specs.length) return;
  const first=todayEntry(specs[0].exKey, itemId);
  ov={type:'fatigue', itemId, restFb:(first && first.restFb)||null,
    rows:specs.map(sp=>({key:sp.exKey, name:sp.name, fatigue:(todayEntry(sp.exKey,itemId)||{}).fatigue||null}))};
  keepAwake();
  renderOverlay();
}
function fatigueHtml(){
  const it=state.items[ov.itemId];
  const circuit = it && it.kind==='circuit';
  const rows=ov.rows.map((r,idx)=>`<div class="fat-row">
      ${ov.rows.length>1 || circuit? `<div class="fat-name">${esc(r.name)}</div>` : ''}
      <div class="stars" role="radiogroup" aria-label="Fatica ${esc(r.name)}">${[1,2,3,4,5].map(k=>`<button class="star ${r.fatigue>=k?'on':''}" role="radio" aria-checked="${r.fatigue===k}" onclick="setFatigue(${idx},${k})" aria-label="${k} su 5">★</button>`).join('')}</div>
      <div class="fat-desc">${r.fatigue? FATIGUE_TXT[r.fatigue] : 'Tocca le stelle: 1 molto facile, 5 al limite'}</div>
    </div>`).join('');
  const rf=ov.restFb;
  return `<div class="fs-overlay fatigue" role="dialog" aria-label="Valutazione fatica">
    <div class="fs-label">${circuit? 'Circuito completato' : 'Ultima serie fatta'}</div>
    <h2 class="fs-title">${circuit? 'Quanto sono stati faticosi?' : esc(it? it.name : '')}</h2>
    ${!circuit? `<div class="fs-sub">Quanto è stato faticoso?</div>` : ''}
    ${rows}
    <div class="fat-row">
      <div class="fat-name">Il recupero ti è sembrato…</div>
      <div class="seg">
        <button class="${rf==='short'?'on':''}" onclick="setRestFb('short')">Corto</button>
        <button class="${rf==='ok'?'on':''}" onclick="setRestFb('ok')">Giusto</button>
        <button class="${rf==='long'?'on':''}" onclick="setRestFb('long')">Troppo lungo</button>
      </div>
    </div>
    <button class="fs-primary" onclick="saveFatigue()">Salva</button>
    <button class="fs-link" onclick="closeOverlay()">Più tardi</button>
  </div>`;
}
function setFatigue(idx, k){ ov.rows[idx].fatigue=k; renderOverlay(); }
function setRestFb(v){ ov.restFb = ov.restFb===v? null : v; renderOverlay(); }
function saveFatigue(){
  const it=state.items[ov.itemId]; if(!it){ closeOverlay(); return; }
  ov.rows.forEach(r=>{ const e=todayEntry(r.key, it.id); if(e){ e.fatigue=r.fatigue; e.restFb=ov.restFb; } });
  saveState();
  const n=nFor(it);
  const rows=ov.rows.map(r=>{
    const spec = it.kind==='circuit'? it.stations.map(activeSpec).find(sp=>sp.exKey===r.key) : it;
    const a = analyze(spec, n, r.key, {includeToday:true, restSec:it.restSec});
    return {key:r.key, name:r.name, a, applied:false};
  });
  ov={type:'summary', itemId:it.id, rows};
  renderApp();
  renderOverlay();
}
function summaryHtml(){
  const rows=ov.rows.map((r,idx)=>`<div class="sum-row">
    <div class="fat-name">${esc(r.name)}</div>
    ${hintHtml(r.a, null)}
    ${r.a.action? (r.applied? `<div class="applied">✓ Scheda aggiornata</div>` : `<button class="hint-act" onclick="applySummary(${idx})">${esc(r.a.actionLabel)} nella scheda</button>`) : ''}
  </div>`).join('');
  return `<div class="fs-overlay fatigue" role="dialog" aria-label="Prossima volta">
    <div class="fs-label">Salvato</div>
    <h2 class="fs-title">La prossima volta</h2>
    ${rows}
    <button class="fs-primary" data-autofocus onclick="closeOverlay()">Fatto</button>
  </div>`;
}
function applySummary(idx){
  const r=ov.rows[idx]; if(!r || !r.a.action) return;
  applyAction(r.key, r.a.action, ov.itemId);
  r.applied=true; renderOverlay();
}
