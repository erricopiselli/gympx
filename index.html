/* ---------- suonerie di fine timer (generate qui, niente file esterni) ---------- */
const RINGTONES = [
  {id:'sveglia', label:'Sveglia'},
  {id:'fischietto', label:'Fischietto'},
  {id:'campanella', label:'Campanella'},
  {id:'classico', label:'Classico'}
];
const SR = 22050;
function synthRing(id){
  const len = Math.round(SR*2.0), out = new Float32Array(len);
  const add = (t0, dur, fn)=>{            // fn(tLocal) -> campione
    const a=Math.round(t0*SR), n=Math.round(dur*SR);
    for(let i=0;i<n && a+i<len;i++){
      const t=i/SR, env=Math.min(1, t/0.004, (dur-t)/0.02);
      out[a+i] += fn(t)*Math.max(0,env);
    }
  };
  const TAU=2*Math.PI;
  if(id==='sveglia'){
    // squillo da sveglia: 3 raffiche di 4 impulsi acuti
    for(let g=0; g<3; g++) for(let p=0; p<4; p++){
      add(g*0.58 + p*0.1, 0.06, t=>{
        const f=2100;
        return 0.6*Math.sin(TAU*f*t) + 0.25*Math.sin(TAU*f*3*t) + 0.12*Math.sin(TAU*f*1.5*t);
      });
    }
  } else if(id==='fischietto'){
    // fischietto da arbitro: corto, corto, lungo
    let seed=1; const noise=()=>{ seed=(seed*16807)%2147483647; return seed/1073741823.5-1; };
    [[0,0.17],[0.27,0.17],[0.54,0.75]].forEach(([t0,d])=>{
      let ph=0;
      add(t0, d, ()=>{
        const f = 2850 + 140*Math.sin(TAU*32*ph/2850);
        ph += f/SR;
        return 0.82*Math.sin(TAU*ph) + 0.18*Math.sin(TAU*2*ph) + 0.06*noise();
      });
    });
  } else if(id==='campanella'){
    // campanella: tre rintocchi con armonici da campana
    const partials=[[1,1,3.2],[2.0,0.55,4.5],[2.76,0.4,5.5],[5.4,0.22,8],[8.93,0.12,11]];
    [[0,1318.5],[0.42,1760],[0.84,1318.5]].forEach(([t0,f0])=>{
      add(t0, 1.1, t=>partials.reduce((acc,[r,a,dec])=>acc + a*Math.exp(-dec*t)*Math.sin(TAU*f0*r*t), 0)*0.55);
    });
  } else {
    // classico: bip-bip-biiip
    [[0,0.2,1046.5],[0.3,0.2,1046.5],[0.6,0.6,1568]].forEach(([t0,d,f])=>{
      add(t0, d, t=>0.7*Math.sin(TAU*f*t) + 0.2*Math.sin(TAU*f*2*t) + 0.1*Math.sin(TAU*f*3*t));
    });
  }
  // taglia il silenzio finale
  let end=len; while(end>1 && Math.abs(out[end-1])<1e-4) end--;
  return out.subarray(0, end);
}
function encodeWavUrl(samples){
  const buf=new ArrayBuffer(44+samples.length*2), v=new DataView(buf);
  const w=(o,str)=>{ for(let i=0;i<str.length;i++) v.setUint8(o+i, str.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36+samples.length*2, true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,SR,true);
  v.setUint32(28,SR*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40, samples.length*2, true);
  for(let i=0;i<samples.length;i++){ const x=Math.max(-1, Math.min(1, samples[i])); v.setInt16(44+i*2, x<0? x*0x8000 : x*0x7FFF, true); }
  return URL.createObjectURL(new Blob([buf], {type:'audio/wav'}));
}
const ringCache={};
function ringUrl(){
  const id=getRingtone(), reps=getRingReps(), key=id+'-'+reps;
  if(ringCache[key]) return ringCache[key];
  const one=synthRing(id), gap=Math.round(0.35*SR);
  const all=new Float32Array(one.length*reps + gap*(reps-1));
  for(let r=0;r<reps;r++) all.set(one, r*(one.length+gap));
  // volume al massimo: compressione morbida e normalizzazione
  let peak=0;
  for(let i=0;i<all.length;i++){ all[i]=Math.tanh(1.8*all[i]); peak=Math.max(peak, Math.abs(all[i])); }
  const g = peak? 0.97/peak : 1;
  for(let i=0;i<all.length;i++) all[i]*=g;
  return ringCache[key]=encodeWavUrl(all);
}

const audioEls={};
let audioUnlocked=false, alarmStartedAt=0;
const SESSION_TYPE = {duck:'transient', pause:'transient-solo', loud:'playback'};
function applyAudioSession(){
  try{ if(navigator.audioSession) navigator.audioSession.type = SESSION_TYPE[getSoundMode()]; }catch(e){}
}
function primeEl(a){
  try{
    a.muted=true;
    const p=a.play();
    if(p && p.then) p.then(()=>{ a.pause(); a.currentTime=0; a.muted=false; }).catch(()=>{ a.muted=false; });
    else { a.pause(); a.muted=false; }
  }catch(e){ a.muted=false; }
}
function unlockAudio(){
  applyAudioSession();
  if(audioUnlocked) return;
  audioUnlocked=true;
  Object.keys(SOUNDS).forEach(k=>{ const a=new Audio(SOUNDS[k]); a.preload='auto'; audioEls[k]=a; primeEl(a); });
  const e=new Audio(ringUrl()); e.preload='auto'; audioEls.end=e; primeEl(e);
}
function refreshEndSound(){
  const a=audioEls.end; if(!a) return;
  const url=ringUrl();
  if(a.src!==url){ a.pause(); a.src=url; a.load(); }
}
function playSound(k){
  if(k==='end') refreshEndSound();
  const a=audioEls[k];
  if(!a){ fallbackBeep(k); return; }
  try{
    applyAudioSession();
    a.muted=false; a.currentTime=0;
    if(k==='end') alarmStartedAt=Date.now();
    const p=a.play();
    if(p && p.catch) p.catch(()=>fallbackBeep(k));
  }catch(e){ fallbackBeep(k); }
}
function stopAlarm(){
  const a=audioEls.end;
  if(a && !a.paused && Date.now()-alarmStartedAt>400){ a.pause(); a.currentTime=0; }
}
document.addEventListener('pointerdown', stopAlarm, true);
function previewAlarm(){
  const fresh=!audioUnlocked;
  unlockAudio();
  setTimeout(()=>playSound('end'), fresh? 300 : 30);
}
function fallbackBeep(k){
  try{
    const ctx = window._audioCtx || (window._audioCtx=new (window.AudioContext||window.webkitAudioContext)());
    if(ctx.state==='suspended') ctx.resume();
    const seq = k==='end'? [[1046,0],[1046,0.3],[1568,0.6],[1046,1.2],[1046,1.5],[1568,1.8]] : k==='go'? [[1046,0]] : [[784,0]];
    seq.forEach(([f,d])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
      const t=ctx.currentTime+d;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.6,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
      o.start(t); o.stop(t+0.2);
    });
  }catch(e){}
}
function testSound(){ previewAlarm(); showToast('Allarme di fine timer: fai partire la musica per provarlo'); }

/* ---------- schermo sempre acceso durante l'allenamento ---------- */
let wakeLockRef=null, awakeUntil=0, awakeCheck=null;
async function acquireWakeLock(){
  try{ if('wakeLock' in navigator && (!wakeLockRef || wakeLockRef.released)) wakeLockRef=await navigator.wakeLock.request('screen'); }
  catch(e){ console.warn('Wake Lock non disponibile:', e.message); }
}
function releaseWakeLock(){ if(wakeLockRef){ wakeLockRef.release().catch(()=>{}); wakeLockRef=null; } }
function keepAwake(){
  awakeUntil=Date.now()+10*60*1000;
  acquireWakeLock();
  clearTimeout(awakeCheck); awakeCheck=setTimeout(checkAwake, 60000);
}
function checkAwake(){
  if(activeTimer || Date.now()<awakeUntil){ awakeCheck=setTimeout(checkAwake, 60000); return; }
  releaseWakeLock();
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){
    if(Date.now()<awakeUntil || activeTimer) acquireWakeLock();
    if(activeTimer) tickTimer();
  }
});

/* ---------- CSV ---------- */
function csvEscape(val){ const s=String(val==null? '' : val); return /[;"\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadCSV(rows, filename){
  const csv=rows.map(r=>r.map(csvEscape).join(';')).join('\r\n');
  const blob=new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast('CSV esportato');
}
function exportRoutineCSV(){
  const rows=[['Giorno','Ordine','Blocco','Esercizio','Categoria','Modalità','Serie/Giri','Rip min','Rip max','Per lato','Durata (s)','Kg','Aumento kg','Recupero (s)','Note']];
  DAYS.forEach(day=>{
    dayItems(day).forEach((it,i)=>{
      if(it.kind==='exercise'){
        rows.push([DAY_FULL[day], i+1, '', it.name, TYPE_LABELS[it.type]||it.type, it.mode==='time'?'Tempo':'Ripetizioni', it.sets, it.repsMin??'', it.repsMax??'', it.perSide?'sì':'', it.durationSec??'', it.weight??'', it.weightStep??'', it.restSec, it.note||'']);
      } else {
        it.stations.forEach(st=>st.options.forEach((o,k)=>{
          rows.push([DAY_FULL[day], i+1, it.name+(k>0?' (alternativa)':''), o.name, TYPE_LABELS[o.type]||o.type, o.mode==='time'?'Tempo':'Ripetizioni', it.rounds, o.repsMin??'', o.repsMax??'', o.perSide?'sì':'', o.durationSec??'', o.weight??'', o.weightStep??'', it.restSec, it.note||'']);
        }));
      }
    });
  });
  downloadCSV(rows, `gympx-scheda-${todayISO()}.csv`);
}
function exportProgressCSV(){
  const rows=[['Esercizio','Data','Giorno','Contesto','Serie/Giro','Valore (rip/sec)','Kg','Fatica (1-5)','Recupero']];
  Object.keys(state.history).forEach(key=>{
    histList(key).slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
      (e.sets||[]).forEach((s,i)=>{ if(s) rows.push([e.name, e.date, DAY_FULL[e.day]||'', e.ctx==='circuit'?'Circuito':'Esercizio', i+1, s.value||0, s.kg||0, e.fatigue||'', e.restFb==='short'?'corto':e.restFb==='long'?'troppo lungo':e.restFb==='ok'?'giusto':'']); });
    });
  });
  downloadCSV(rows, `gympx-progressi-${todayISO()}.csv`);
}

/* ---------- GitHub sync ---------- */
const GH_CONFIG_KEY='caricoGithubConfig';
const GH_LAST_CONFIG_KEY='caricoGithubLastConfig';
function loadGithubConfig(){ try{ return JSON.parse(localStorage.getItem(GH_CONFIG_KEY))||{}; }catch(e){ return {}; } }
function loadGithubLastConfig(){ try{ return JSON.parse(localStorage.getItem(GH_LAST_CONFIG_KEY)); }catch(e){ return null; } }
function saveGithubLastConfig(cfg){ try{ localStorage.setItem(GH_LAST_CONFIG_KEY, JSON.stringify(cfg)); }catch(e){} }
function disconnectGithub(){
  if(!confirm('Scollegare GitHub? La sincronizzazione automatica si ferma (i dati locali restano). Potrai riconnetterti con un tocco.')) return;
  const cfg=loadGithubConfig();
  if(cfg.token && cfg.repo) saveGithubLastConfig(cfg);
  localStorage.removeItem(GH_CONFIG_KEY);
  renderApp(); showToast('GitHub scollegato');
}
async function reconnectGithub(){
  const last=loadGithubLastConfig();
  if(!last || !last.token || !last.repo) return;
  localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(last));
  showToast('Riconnesso, sincronizzo…');
  await autoSyncOnLoad(); renderApp();
}
function saveGithubConfigFromForm(){
  const token=$('gh-token').value.trim();
  const repo=$('gh-repo').value.trim().replace(/^\/+|\/+$/g,'');
  const path=$('gh-path').value.trim()||'carico-data.json';
  const branch=$('gh-branch').value.trim()||'main';
  const autoSync=$('gh-autosync').checked;
  if(!token || !repo){ alert('Inserisci almeno token e repository (formato utente/nome-repo).'); return; }
  const prev=loadGithubConfig();
  const cfg={token,repo,path,branch,autoSync,lastSync:prev.lastSync||null};
  localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg));
  saveGithubLastConfig(cfg);
  showToast('Configurazione salvata');
  if(autoSync) autoSyncOnLoad();
}
let ghSyncTimeout=null;
function scheduleGithubAutoSync(){
  const cfg=loadGithubConfig();
  if(!cfg.token || !cfg.repo || !cfg.autoSync) return;
  clearTimeout(ghSyncTimeout);
  ghSyncTimeout=setTimeout(()=>{ pushToGithub(true); }, 2500);
}
function utf8ToBase64(str){ const bytes=new TextEncoder().encode(str); let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin); }
function base64ToUtf8(b64){ const bin=atob(b64.replace(/\n/g,'')); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
async function githubGetFile(cfg){
  const url=`https://api.github.com/repos/${cfg.repo}/contents/${encodeURIComponent(cfg.path)}?ref=${encodeURIComponent(cfg.branch)}`;
  const res=await fetch(url,{headers:{Authorization:'Bearer '+cfg.token, Accept:'application/vnd.github+json'}, cache:'no-store'});
  if(res.status===404) return null;
  if(!res.ok){ const t=await res.text().catch(()=> ''); throw new Error('Errore GitHub ('+res.status+'). '+t.slice(0,150)); }
  return res.json();
}
let ghSyncing=false, ghSyncError=null;
async function pushToGithub(silent){
  const cfg=loadGithubConfig();
  if(!cfg.token || !cfg.repo){ if(!silent) alert('Configura prima token e repository, poi tocca "Salva configurazione".'); return; }
  if(!silent) showToast('Salvataggio su GitHub…');
  ghSyncing=true; refreshGithubStatusBar();
  try{
    const existing=await githubGetFile(cfg);
    const body={message:'Aggiornamento dati GymPX, '+new Date().toLocaleString('it-IT'), content:utf8ToBase64(JSON.stringify(serializable(),null,2)), branch:cfg.branch};
    if(existing && existing.sha) body.sha=existing.sha;
    const url=`https://api.github.com/repos/${cfg.repo}/contents/${encodeURIComponent(cfg.path)}`;
    const res=await fetch(url,{method:'PUT',headers:{Authorization:'Bearer '+cfg.token, Accept:'application/vnd.github+json','Content-Type':'application/json'}, body:JSON.stringify(body)});
    if(!res.ok){ const t=await res.text().catch(()=> ''); throw new Error('Errore GitHub ('+res.status+'). '+t.slice(0,150)); }
    cfg.lastSync=new Date().toLocaleString('it-IT');
    localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg));
    ghSyncError=null;
    if(!silent){ showToast('Salvato su GitHub'); if(state.modal && state.modal.type==='settings') renderApp(); }
  }catch(e){
    ghSyncError=e.message;
    if(!silent) alert('Errore nel salvataggio su GitHub: '+e.message); else console.warn('Auto-sync fallito:', e.message);
  }finally{ ghSyncing=false; refreshGithubStatusBar(); }
}
async function pullFromGithub(){
  const cfg=loadGithubConfig();
  if(!cfg.token || !cfg.repo){ alert('Configura prima token e repository, poi tocca "Salva configurazione".'); return; }
  try{
    const file=await githubGetFile(cfg);
    if(!file){ alert('Nessun file trovato su GitHub a questo percorso. Prova prima "Salva dati su GitHub".'); return; }
    const data=JSON.parse(base64ToUtf8(file.content));
    if(!isValidData(data)) throw new Error('Formato dati non valido');
    if(confirm('Sovrascrivere i dati di questo iPhone con quelli salvati su GitHub?')){
      state=migrate(data); state.modal=null;
      saveState();
      cfg.lastSync=new Date().toLocaleString('it-IT'); localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg));
      renderApp(); showToast('Dati caricati da GitHub');
    }
  }catch(e){ alert('Errore nel caricamento da GitHub: '+e.message); }
}
async function autoSyncOnLoad(){
  const cfg=loadGithubConfig();
  if(!cfg.token || !cfg.repo || !cfg.autoSync) return;
  try{
    const file=await githubGetFile(cfg);
    if(file){
      const remote=JSON.parse(base64ToUtf8(file.content));
      if(isValidData(remote)){
        const remoteTime=remote.updatedAt||0, localTime=state.updatedAt||0;
        if(remoteTime>localTime){
          const keepDay=state.activeDay;
          state=migrate(remote); state.modal=null; state.activeDay=keepDay;
          persistLocal(); renderApp(); showToast('Sincronizzato da GitHub');
        } else if(localTime>remoteTime || (remote.version||0)<DATA_VERSION){
          await pushToGithub(true);
        }
      }
    } else { await pushToGithub(true); }
    cfg.lastSync=new Date().toLocaleString('it-IT'); localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg));
    refreshGithubStatusBar();
  }catch(e){ console.warn('Auto-sync iniziale fallito:', e.message); }
}

/* ---------- backup ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(serializable(),null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`gympx-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast('Backup esportato');
}
function importData(event){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!isValidData(data)) throw new Error('formato non valido');
      if(confirm('Importare questo backup? I dati attuali verranno sovrascritti.')){
        state=migrate(data); state.modal=null; saveState(); renderApp(); showToast('Backup importato');
      }
    }catch(e){ alert('File non valido: '+e.message); }
  };
  reader.readAsText(file);
}
function resetData(){
  if(!confirm('Vuoi davvero cancellare tutti i dati? Azione irreversibile.')) return;
  state=blankState(); saveState(); renderApp(); showToast('Dati cancellati');
}
function showToast(msg){
  const t=$('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ---------- swipe su card esercizio ---------- */
let swipeState=null;

function initSwipeHandlers(){
  const app=document.getElementById('app');
  app.addEventListener('touchstart', onSwipeStart, {passive:false});
  app.addEventListener('touchmove', onSwipeMove, {passive:false});
  app.addEventListener('touchend', onSwipeEnd);
  app.addEventListener('touchcancel', onSwipeCancel);
}

function onSwipeStart(e){
  const card=e.target.closest('.exercise-card');
  if(!card){ swipeState=null; return; }
  const t=e.touches[0];
  swipeState={cardEl:card, exId:card.id.replace('card-',''), startX:t.clientX, startY:t.clientY, currentX:t.clientX, dragging:false};
}

function onSwipeMove(e){
  if(!swipeState) return;
  const t=e.touches[0];
  const dx=t.clientX-swipeState.startX;
  const dy=t.clientY-swipeState.startY;
  if(!swipeState.dragging){
    if(Math.abs(dx)>7 && Math.abs(dx)>Math.abs(dy)*1.5){
      swipeState.dragging=true;
    } else if(Math.abs(dy)>7){
      swipeState=null;
      return;
    } else {
      return;
    }
  }
  e.preventDefault();
  swipeState.currentX=t.clientX;
  const clamped=Math.max(-140, Math.min(140, dx));
  swipeState.cardEl.style.transition='none';
  swipeState.cardEl.style.transform=`translateX(${clamped}px)`;
  swipeState.cardEl.classList.toggle('swipe-right', clamped>24);
  swipeState.cardEl.classList.toggle('swipe-left', clamped<-24);
}

function onSwipeEnd(){
  if(!swipeState || !swipeState.dragging){ swipeState=null; return; }
  const dx=swipeState.currentX-swipeState.startX;
  const card=swipeState.cardEl;
  const exId=swipeState.exId;
  card.style.transition='transform 0.2s ease';
  card.style.transform='';
  card.classList.remove('swipe-right','swipe-left');
  const threshold=90;
  if(dx<-threshold){
    confirmDeleteFromSwipe(exId);
  } else if(dx>threshold){
    openCopyModal(exId);
  }
  swipeState=null;
}

function onSwipeCancel(){
  if(swipeState && swipeState.cardEl){
    swipeState.cardEl.style.transition='transform 0.2s ease';
    swipeState.cardEl.style.transform='';
    swipeState.cardEl.classList.remove('swipe-right','swipe-left');
  }
  swipeState=null;
}


/* ---------- drag-to-dismiss sui modali (dalla maniglia in alto) ---------- */
let modalDragState=null;

function initModalDragHandlers(){
  document.addEventListener('touchstart', onModalDragStart, {passive:false});
  document.addEventListener('touchmove', onModalDragMove, {passive:false});
  document.addEventListener('touchend', onModalDragEnd);
  document.addEventListener('touchcancel', onModalDragCancel);
}

function onModalDragStart(e){
  const modal=e.target.closest('.modal');
  if(!modal){ modalDragState=null; return; }
  const rect=modal.getBoundingClientRect();
  const t=e.touches[0];
  if(t.clientY-rect.top>44) return; // solo se si parte dalla zona della maniglia
  modalDragState={modalEl:modal, startY:t.clientY, currentY:t.clientY, dragging:false};
}

function onModalDragMove(e){
  if(!modalDragState) return;
  const t=e.touches[0];
  const dy=t.clientY-modalDragState.startY;
  if(!modalDragState.dragging){
    if(dy>8){ modalDragState.dragging=true; }
    else if(dy<-6){ modalDragState=null; return; }
    else { return; }
  }
  if(dy<0) return;
  e.preventDefault();
  modalDragState.currentY=t.clientY;
  modalDragState.modalEl.style.transition='none';
  modalDragState.modalEl.style.transform=`translateY(${dy}px)`;
}

function onModalDragEnd(){
  if(!modalDragState || !modalDragState.dragging){ modalDragState=null; return; }
  const dy=modalDragState.currentY-modalDragState.startY;
  const modal=modalDragState.modalEl;
  modal.style.transition='transform 0.2s ease';
  if(dy>110){
    modal.style.transform='translateY(100%)';
    setTimeout(()=>{ closeModal(); }, 150);
  } else {
    modal.style.transform='';
  }
  modalDragState=null;
}

function onModalDragCancel(){
  if(modalDragState && modalDragState.modalEl){
    modalDragState.modalEl.style.transition='transform 0.2s ease';
    modalDragState.modalEl.style.transform='';
  }
  modalDragState=null;
}


/* ---------- init ---------- */
(function init(){
  const root=document.createElement('div'); root.id='overlay-root'; document.body.appendChild(root);
  applyTheme(getTheme());
  renderApp();
  autoSyncOnLoad();
  initSwipeHandlers();
  initModalDragHandlers();
})();
